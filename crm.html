  '월거래액':'monthlyFee','월거래':'monthlyFee','월금액':'monthlyFee',
  '연거래액':'annualFee','연거래':'annualFee','연금액':'annualFee',
};
const OUTBOUND_MAP = {
  '기업명':'name','회사명':'name','기업':'name','company':'name',
  '임직원수':'employees','임직원':'employees','직원수':'employees','사원수':'employees',
  '지역':'region','본사위치':'region','위치':'region',
  '업종':'industry','산업':'industry','업태':'industry',
  '서비스':'service','제안서비스':'service',
  '상태':'status','진행상태':'status',
  '담당자':'owner','영업담당자':'owner',
  '메모':'note','비고':'note','특이사항':'note',
  '소스':'source','출처':'source',
};
const DEALS_MAP = {
  '기업명':'name','회사명':'name','기업':'name','company':'name',
  '월거래액':'monthly','월거래':'monthly','월금액':'monthly',
  '연거래액':'annual','연거래':'annual','연금액':'annual',
  '담당자':'owner','영업담당자':'owner',
  '상품':'product','서비스':'product','제품':'product',
  '상태':'status','진행상태':'status',
  '메모':'note','비고':'note',
  '시작일':'startDate','오픈일':'startDate',
};

// 헤더 정규화: 공백 제거 + 소문자
function normalizeHeader(h) {
  return String(h||'').replace(/\s/g,'').toLowerCase();
}

function buildNormMap(colMap) {
  const m = {};
  Object.entries(colMap).forEach(([k,v]) => { m[k.replace(/\s/g,'').toLowerCase()] = v; });
  return m;
}

function parseSheet(rows, colMap) {
  if (!rows || rows.length < 2) return [];
  const normMap = buildNormMap(colMap);
  const rawHeaders = rows[0];
  const headers = rawHeaders.map(h => normalizeHeader(h));
  const parsed = rows.slice(1)
    .filter(row => row.some(c => c != null && String(c).trim() !== ''))
    .map(row => {
      const obj = {};
      headers.forEach((h, i) => {
        const field = normMap[h];
        if (field) obj[field] = row[i] != null ? String(row[i]).trim() : '';
      });
      return obj;
    })
    .filter(obj => obj.name && obj.name !== '');
  return parsed;
}

// 시트 타입 자동 감지
function detectSheetType(sheetName, headers) {
  const n = sheetName.replace(/\s/g,'').toLowerCase();
  if (n.includes('인바운드')||n.includes('inbound')) return 'inbound';
  if (n.includes('아웃바운드')||n.includes('outbound')) return 'outbound';
  if (n.includes('딜')||n.includes('deal')||n.includes('오픈')) return 'deals';
  // 헤더로 타입 추론
  const normH = headers.map(h=>normalizeHeader(h));
  if (normH.includes('월거래액')||normH.includes('월거래')||normH.includes('monthly')) return 'deals';
  if (normH.includes('업종')||normH.includes('industry')) return 'outbound';
  return 'inbound';
}

async function parseExcelFile(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      try {
        const XLSX = window.XLSX;
        const wb = XLSX.read(e.target.result, { type:'array', cellDates: true });
        const result = { inbound:[], outbound:[], deals:[], _debug:[] };
        wb.SheetNames.forEach(name => {
          const ws = wb.Sheets[name];
          const rows = XLSX.utils.sheet_to_json(ws, { header:1, defval:'' });
          if (!rows || rows.length < 2) { result._debug.push(`시트 "${name}": 데이터 없음`); return; }
          const type = detectSheetType(name, rows[0]);
          const mapRef = { inbound:INBOUND_MAP, outbound:OUTBOUND_MAP, deals:DEALS_MAP }[type];
          const parsed = parseSheet(rows, mapRef);
          result[type] = [...(result[type]||[]), ...parsed];
          result._debug.push(`시트 "${name}" → ${type} ${parsed.length}건 (전체 ${rows.length-1}행)`);
        });
        resolve(result);
      } catch(err) { reject(err); }
    };
    reader.onerror = reject;
    reader.readAsArrayBuffer(file);
  });
}

function notionPropText(prop) {
  if (!prop) return '';
  if (prop.type==='title') return (prop.title||[]).map(t=>t.plain_text).join('');
  if (prop.type==='rich_text') return (prop.rich_text||[]).map(t=>t.plain_text).join('');
  if (prop.type==='number') return prop.number!=null?String(prop.number):'';
  if (prop.type==='select') return prop.select?.name||'';
  if (prop.type==='date') return prop.date?.start||'';
  if (prop.type==='email') return prop.email||'';
  return '';
}

const NOTION_INBOUND = {'기업명|회사명|Name':'name','임직원수|직원수|임직원':'employees','지역':'region','서비스':'service','상태|Status':'status','인입일|인입 일자':'inflowDate','담당자':'owner','고객담당자|담당자명':'contactName','이메일':'email','메모|비고|내용':'detail','미팅일':'meetingDate'};
const NOTION_OUTBOUND = {'기업명|회사명|Name':'name','임직원수|직원수':'employees','지역':'region','업종':'industry','서비스':'service','상태|Status':'status','담당자':'owner','메모|비고':'note'};

function mapNotionPage(page, fieldMap) {
  const p=page.properties||{}, obj={};
  Object.entries(fieldMap).forEach(([ks,field])=>{
    for (const k of ks.split('|')) { const v=notionPropText(p[k]); if(v){obj[field]=v;break;} }
  });
  return obj;
}

async function fetchNotionDB(notionKey, dbId) {
  const id=dbId.replace(/-/g,'');
  const fmtId=[id.slice(0,8),id.slice(8,12),id.slice(12,16),id.slice(16,20),id.slice(20)].join('-');
  const res = await fetch(`https://api.notion.com/v1/databases/${fmtId}/query`, {
    method:'POST',
    headers:{'Authorization':`Bearer ${notionKey}`,'Notion-Version':'2022-06-28','Content-Type':'application/json'},
    body:JSON.stringify({page_size:100})
  });
  if (!res.ok) { const err=await res.json().catch(()=>({})); throw new Error(err.message||`HTTP ${res.status}`); }
  return (await res.json()).results||[];
}

  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([['기업명','임직원수','지역','업종','서비스','상태','담당자','메모'],['(주)타겟기업','300','경기 성남','IT/소프트웨어','복지포인트','미접촉','이종민','리멤버 통해 인지']]),'아웃바운드');

function DataImportModal({ onClose, onImport, currentData }) {
  const [tab, setTab] = useStateDM('excel');
  const [dragging, setDragging] = useStateDM(false);
  const [preview, setPreview] = useStateDM(null);
  const [loading, setLoading] = useStateDM(false);
  const [error, setError] = useStateDM('');
  const [importMode, setImportMode] = useStateDM('replace');
  const [notionKey, setNotionKey] = useStateDM(() => { try{return JSON.parse(localStorage.getItem('bizplus_crm_v1')||'{}').notionKey||'';}catch{return '';} });
  const [notionInboundId, setNotionInboundId] = useStateDM('');
  const [notionOutboundId, setNotionOutboundId] = useStateDM('');
  const [notionLoading, setNotionLoading] = useStateDM(false);
  const [notionResult, setNotionResult] = useStateDM(null);
  const fileRef = useRefDM(null);
  const reset = () => { setError(''); setPreview(null); setNotionResult(null); };

  const handleFile = async file => {
    if (!file) return;
    if (!window.XLSX) { setError('XLSX 라이브러리 로딩 중입니다. 잠시 후 다시 시도해주세요.'); return; }
    setLoading(true); reset();
    try { setPreview(await parseExcelFile(file)); }
    catch(e) { setError('파일 파싱 실패: '+e.message); }
    finally { setLoading(false); }
  };

  const syncNotion = async () => {
    if (!notionKey) { setError('Notion 키를 입력해주세요'); return; }
    if (!notionInboundId && !notionOutboundId) { setError('최소 하나의 DB ID를 입력해주세요'); return; }
    setNotionLoading(true); reset();
    const result = { inbound:[], outbound:[], deals:[] };
    try {
      if (notionInboundId) { const rows=await fetchNotionDB(notionKey,notionInboundId); result.inbound=rows.map(p=>mapNotionPage(p,NOTION_INBOUND)).filter(r=>r.name); }
      if (notionOutboundId) { const rows=await fetchNotionDB(notionKey,notionOutboundId); result.outbound=rows.map(p=>mapNotionPage(p,NOTION_OUTBOUND)).filter(r=>r.name); }
      setNotionResult(result);
    } catch(e) {
      const m=e.message||'';
      setError(m.includes('fetch')||m.includes('CORS')||m.includes('network')
        ? 'Notion API CORS 차단됨\n→ Notion DB → ··· → 내보내기 → CSV 저장 후 엑셀 업로드 탭에서 업로드해 주세요'
        : 'Notion 오류: '+m);
    } finally { setNotionLoading(false); }
  };

  const doImport = () => {
    const src=preview||notionResult; if(!src) return;
    let d={...currentData};
    const merge=(arr,n)=>{const ex=new Set(arr.map(i=>i.name));return [...arr,...(n||[]).filter(i=>!ex.has(i.name))];};
    if(importMode==='replace'){if(src.inbound?.length)d.inbound=src.inbound;if(src.outbound?.length)d.outbound=src.outbound;if(src.deals?.length)d.deals=src.deals;}
    else{if(src.inbound?.length)d.inbound=merge(d.inbound,src.inbound);if(src.outbound?.length)d.outbound=merge(d.outbound,src.outbound);if(src.deals?.length)d.deals=merge(d.deals,src.deals);}
    onImport(d); onClose();
  };

  const src=preview||notionResult;
  const ib=src?.inbound?.length||0, ob=src?.outbound?.length||0, dl=src?.deals?.length||0, total=ib+ob+dl;

  return (
    <Modal onClose={onClose} title="데이터 가져오기" size="lg">
      <div style={{display:'flex',gap:4,marginBottom:18,padding:3,background:'var(--bg-sunken)',borderRadius:9}}>
        {[['excel','📊 엑셀 업로드'],['notion','🔗 Notion 동기화']].map(([k,l])=>(
          <button key={k} onClick={()=>{setTab(k);reset();}} style={{flex:1,padding:'8px',border:'none',borderRadius:7,cursor:'pointer',fontFamily:'inherit',fontSize:13,background:tab===k?'#fff':'transparent',color:tab===k?'var(--ink)':'var(--ink-3)',boxShadow:tab===k?'var(--shadow-1)':'none',fontWeight:tab===k?600:400}}>{l}</button>
        ))}
      </div>
      {tab==='excel' && (
        <div style={{display:'flex',flexDirection:'column',gap:10}}>
          <div onDragOver={e=>{e.preventDefault();setDragging(true);}} onDragLeave={()=>setDragging(false)} onDrop={e=>{e.preventDefault();setDragging(false);handleFile(e.dataTransfer.files[0]);}} onClick={()=>fileRef.current?.click()} style={{border:`2px dashed ${dragging?'var(--accent)':'var(--line)'}`,borderRadius:10,padding:'28px 20px',textAlign:'center',cursor:'pointer',background:dragging?'var(--accent-soft)':'var(--bg-sunken)'}}>
            <input ref={fileRef} type="file" accept=".xlsx,.xls,.csv" style={{display:'none'}} onChange={e=>handleFile(e.target.files[0])}/>
            <div style={{fontSize:26,marginBottom:6}}>📂</div>
            <div style={{fontSize:13,fontWeight:600}}>엑셀 파일을 드래그하거나 클릭해서 업로드</div>
            <div style={{fontSize:11.5,color:'var(--ink-3)',marginTop:4}}>.xlsx · .xls · .csv 지원</div>
          </div>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
            <div style={{fontSize:12,color:'var(--ink-3)'}}>시트명: <strong>인바운드 / 아웃바운드 / 오픈딜</strong></div>
            <button onClick={downloadTemplate} style={{padding:'6px 12px',border:'1px solid var(--line)',borderRadius:7,background:'var(--bg-elev)',cursor:'pointer',fontFamily:'inherit',fontSize:12}}>📥 템플릿 다운로드</button>
          </div>
        </div>
      )}
      {tab==='notion' && (
        <div style={{display:'flex',flexDirection:'column',gap:6}}>
          <Field label="Notion Integration Token"><Input type="password" value={notionKey} onChange={e=>setNotionKey(e.target.value)} placeholder="ntn_…"/></Field>
          <Field label="인바운드 DB ID" hint="선택사항"><Input value={notionInboundId} onChange={e=>setNotionInboundId(e.target.value)} placeholder="xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"/></Field>
          <Field label="아웃바운드 DB ID" hint="선택사항"><Input value={notionOutboundId} onChange={e=>setNotionOutboundId(e.target.value)} placeholder="xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"/></Field>
          <button onClick={syncNotion} disabled={notionLoading} style={{width:'100%',padding:'10px',border:'none',borderRadius:8,fontFamily:'inherit',fontSize:13,fontWeight:600,cursor:notionLoading?'wait':'pointer',background:notionLoading?'var(--bg-sunken)':'var(--ink)',color:notionLoading?'var(--ink-4)':'#fff'}}>{notionLoading?'불러오는 중…':'🔗 Notion DB에서 불러오기'}</button>
          <div style={{padding:'10px 12px',background:'#fffbeb',border:'1px solid #f5d67a',borderRadius:8,fontSize:11.5,color:'#7a5c00',lineHeight:1.7}}>
            <strong>CORS 차단 시 대안</strong> — Notion DB → ··· → 내보내기 → CSV 저장<br/>→ 엑셀 업로드 탭에서 해당 CSV 파일 업로드
          </div>
        </div>
      )}
      {(loading||notionLoading) && <div style={{textAlign:'center',padding:12,color:'var(--ink-3)',fontSize:13,marginTop:10}}>처리 중…</div>}
      {error && <div style={{marginTop:10,padding:'10px 12px',background:'#fff0f0',border:'1px solid #ffb3b3',borderRadius:8,fontSize:12.5,color:'#c00',whiteSpace:'pre-line'}}>{error}</div>}

      {/* 파싱 결과 - 0건일 때도 디버그 정보 표시 */}
      {src && total===0 && !loading && (
        <div style={{marginTop:12,padding:'12px 14px',background:'#fffbeb',border:'1px solid #f5d67a',borderRadius:8,fontSize:12,color:'#7a5c00',lineHeight:1.8}}>
          <strong>⚠ 데이터를 인식하지 못했습니다</strong>
          {src._debug?.length>0 && <div style={{marginTop:4,opacity:0.8}}>{src._debug.join(' · ')}</div>}
          <div style={{marginTop:6}}>
            <div>• 1행에 헤더가 있는지 확인해주세요 (기업명, 임직원수, 지역 ...)</div>
            <div>• 헤더에 <strong>기업명</strong> 또는 <strong>회사명</strong> 컬럼이 반드시 있어야 합니다</div>
            <div>• 아래 <strong>템플릿 다운로드</strong> 후 해당 형식으로 작성해주세요</div>
          </div>
        </div>
      )}

      {src && total>0 && (
        <div style={{marginTop:16,paddingTop:16,borderTop:'1px solid var(--line)'}}>
          <div style={{fontSize:12.5,fontWeight:600,marginBottom:6}}>인식된 데이터</div>
          {src._debug?.length>0 && <div style={{fontSize:11,color:'var(--ink-3)',marginBottom:8}}>{src._debug.join(' · ')}</div>}
          <div style={{display:'flex',gap:8,marginBottom:10,flexWrap:'wrap'}}>
            {[['인바운드',ib],['아웃바운드',ob],['오픈딜',dl]].map(([k,v])=>v>0&&<div key={k} style={{padding:'5px 12px',background:'var(--bg-sunken)',borderRadius:7,fontSize:12}}>{k} <strong style={{color:'var(--accent)'}}>{v}건</strong></div>)}
          </div>
          <div style={{display:'flex',gap:6,marginBottom:12}}>
            {[['replace','기존 데이터 교체'],['merge','새 항목만 추가']].map(([k,l])=>(
              <button key={k} onClick={()=>setImportMode(k)} style={{padding:'6px 12px',borderRadius:7,border:'1px solid',cursor:'pointer',fontFamily:'inherit',fontSize:12,borderColor:importMode===k?'var(--accent)':'var(--line)',background:importMode===k?'var(--accent-soft)':'transparent',color:importMode===k?'var(--accent)':'var(--ink-2)',fontWeight:importMode===k?600:400}}>{l}</button>
            ))}
          </div>
          <PrimaryBtn onClick={doImport} style={{width:'100%',justifyContent:'center'}}>CRM에 {total}건 가져오기</PrimaryBtn>
        </div>
      )}
    </Modal>
  );
}

Object.assign(window, { DataImportModal, downloadTemplate });
</script>

<script type="text/babel">
/* eslint-disable */
const { useState: useStateAt } = React;

// ── Claude API helper ──────────────────────────────────────────────────────
async function callClaudeApi(apiKey, model, prompt) {

    method: 'POST',
    headers: {
      'x-api-key': apiKey,
      'anthropic-version': '2023-06-01',

      'anthropic-dangerous-direct-browser-access': 'true',
    },
    body: JSON.stringify({
      model: model || 'claude-sonnet-4-6',
      max_tokens: 2048,
      messages: [{ role: 'user', content: prompt }]
    })
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.error?.message || `Claude API 오류 (HTTP ${res.status})`);
  }
  const data = await res.json();

}

// ── Notion API helper ──────────────────────────────────────────────────────
async function pushNotionPage(notionKey, pageId, title, content) {
  const cleanId = pageId.replace(/-/g, '');
  const paragraphs = content.split('\n\n').filter(Boolean);
  const blocks = paragraphs.slice(0, 100).map(p => ({
    object: 'block', type: 'paragraph',
    paragraph: { rich_text: [{ type: 'text', text: { content: p.slice(0, 2000) } }] }
  }));
  const res = await fetch('https://api.notion.com/v1/pages', {
    method: 'POST',
    headers: {
      'Authorization': `Bearer ${notionKey}`,
      'Notion-Version': '2022-06-28',
      'Content-Type': 'application/json',
    },
    body: JSON.stringify({
      parent: { page_id: cleanId },
      properties: { title: { title: [{ text: { content: title } }] } },
      children: blocks,
    })
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.message || `Notion 오류 (HTTP ${res.status})`);
  }
  return res.json();
}

function buildReportPrompt(data, dateLabel) {
  const s = summarizeGoals(data.goals);
  const inb = data.inbound || [];
  const deals = data.deals || [];
  const out = data.outbound || [];
  const ownerStats = {};
  deals.forEach(d => {
    const k = d.owner || '기타';
    if (!ownerStats[k]) ownerStats[k] = { count: 0, monthly: 0 };
    ownerStats[k].count++;
    ownerStats[k].monthly += d.monthly || 0;
  });
  const top5 = [...deals].sort((a,b)=>(b.monthly||0)-(a.monthly||0)).slice(0,5).map(d=>`${d.name} (월 ${KRW(d.monthly)}, ${d.owner})`).join('\n');
  const ibStats = { total: inb.length, 검토중: inb.filter(i=>i.status==='검토중').length, 도입확정: inb.filter(i=>i.status==='도입확정').length, 오픈: inb.filter(i=>i.status==='오픈').length };
  return `당신은 비즈플러스제휴팀 팀장입니다.
아래 영업 현황 데이터로 주간 영업보고서를 Notion 마크다운으로 작성해주세요.

[${dateLabel} 주간 영업 현황]
▪ YTD 누적: ${KRW(s.ytdActual)} / 연목표 ${KRW(s.annualGoal)} (${(s.annualRate*100).toFixed(1)}%)
▪ 이번 달: ${KRW(s.monthActual)} / 목표 ${KRW(s.monthGoal)} (${(s.monthRate*100).toFixed(1)}%)
▪ 인바운드: 총 ${ibStats.total}건 (검토중 ${ibStats.검토중} | 도입확정 ${ibStats.도입확정} | 오픈 ${ibStats.오픈})
▪ 아웃바운드 추적 타겟: ${out.length}개
▪ 오픈 딜 총 ${deals.length}건
${Object.entries(ownerStats).map(([k,v])=>`▪ ${k}: ${v.count}건, 월 ${KRW(v.monthly)}`).join('\n')}
▪ TOP 5 딜:
${top5}

[작성 조건]
- Notion 마크다운 형식
- 구조: # 주간 영업보고서 → ## 전체 현황 → ## 개인별 현황 → ## 주요 이슈 및 기회 → ## 이번 주 Action Items

- Action Items는 담당자별로 구체적으로
- 팀 내부 보고용 톤`;
}

function WeeklyReportSection({ data, settings, callClaude }) {
  const [dateLabel, setDateLabel] = useStateAt('2026년 5월 1주차');
  const [loading, setLoading] = useStateAt(false);
  const [result, setResult] = useStateAt('');
  const [copied, setCopied] = useStateAt(false);
  const [notionStatus, setNotionStatus] = useStateAt('');

  const generate = async () => {
    setLoading(true); setResult('');
    try { setResult(await callClaude(buildReportPrompt(data,dateLabel))); }
    catch(e) { alert('오류: '+e.message); }
    finally { setLoading(false); }
  };
  const copy = () => { navigator.clipboard.writeText(result); setCopied(true); setTimeout(()=>setCopied(false),2000); };
  const sendNotion = async () => {
    if (!settings.notionKey||!settings.notionPageId) { alert('API 설정 탭에서 Notion 설정을 완료해주세요'); return; }
    setNotionStatus('loading');
    try {
      await pushNotionPage(settings.notionKey, settings.notionPageId, `[주간보고서] ${dateLabel}`, result);
      setNotionStatus('done');
    } catch(e) {
      navigator.clipboard.writeText(result);
      alert('Notion 직접 전송 실패 (CORS 제한).\n\n내용을 클립보드에 복사했습니다.\nNotion 페이지를 열고 붙여넣기 해주세요.\n\n오류: '+e.message);
      setNotionStatus('');
    }
  };

  return (
    <div style={{display:'grid',gridTemplateColumns:'260px 1fr',gap:14,alignItems:'start'}}>
      <div style={{display:'flex',flexDirection:'column',gap:10}}>
        <Card padding={18}>

          <Field label="주차 레이블">

            <div>• 아웃바운드 타겟 ({(data.outbound||[]).length}건)</div>

            <div>• 담당자별 실적 분석</div>
          </div>
          <GenBtn onClick={generate} loading={loading} disabled={!settings.claudeKey}>
            {!settings.claudeKey?'API 설정 필요':'✦ 주간보고서 생성'}
          </GenBtn>
          {result && (
            <div style={{marginTop:10,display:'flex',flexDirection:'column',gap:6}}>
              <button onClick={copy} style={{padding:'8px',background:'var(--bg-sunken)',border:'1px solid var(--line)',borderRadius:7,cursor:'pointer',fontFamily:'inherit',fontSize:12}}>
                {copied?'✓ 복사됨':'📋 복사 → Notion 붙여넣기'}

function AutomationView({ data }) {

  const saveSettings = s => {

          }}>
            <span style={{fontSize:11,opacity:0.7}}>{t.icon}</span>{t.label}

  );
}

const { useState: useStateA, useEffect: useEffectA } = React;

function exportCRMToExcel(data) {
  // JSON으로 내보내기 → export_excel.py 스크립트로 서식 완벽 보존 Excel 생성
  const json = JSON.stringify({ inbound: data.inbound, outbound: data.outbound, deals: data.deals }, null, 2);
  const blob = new Blob([json], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `crm_data_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
  setTimeout(() => alert(
    '✅ crm_data_XXXXXX.json 다운로드 완료\n\n' +
    '엑셀 파일 생성 방법:\n' +
    '1. 레포 폴더에서 터미널 열기\n' +
    '2. pip install openpyxl  (최초 1회)\n' +
    '3. python3 export_excel.py crm_data_XXXXXX.json'
  ), 100);
}

          <div className="mono" style={{ fontSize: 18, fontWeight: 700, letterSpacing: "-0.02em" }}>{KRW(summary.ytdActual)}</div>
          <div style={{ height: 4, background: "rgba(255,255,255,0.08)", borderRadius: 99, marginTop: 8, marginBottom: 6 }}>
            <div style={{ height: "100%", width: `${Math.min(summary.annualRate, 1) * 100}%`, background: "linear-gradient(90deg, #6c7ee0, #2b3aa3)", borderRadius: 99 }} />
          </div>
          <div style={{ fontSize: 10.5, color: "rgba(232,230,223,0.55)" }}>
            연목표 {KRW(summary.annualGoal)} · {(summary.annualRate * 100).toFixed(1)}%
          </div>
        </div>

        <div style={{ display: "flex", alignItems: "center", gap: 8, padding: "0 6px" }}>
          <Avatar name="비즈플러스" size={24} />
          <div style={{ fontSize: 11.5, lineHeight: 1.3 }}>
            <div style={{ fontWeight: 500 }}>강동헌, 이종민</div>
            <div style={{ color: "rgba(232,230,223,0.55)", fontSize: 10 }}>2명 활성</div>
          </div>
        </div>
      </aside>

      {/* Main */}
      <main style={{ padding: "22px 28px 60px", maxWidth: 1500, width: "100%" }}>
        <Header tab={tab} data={data} onNewActivity={openNewActivity} onSync={() => setToast("엑셀 시트 동기화 완료")} onExport={() => exportCRMToExcel(data)} />
        {tab === "dashboard" && <Dashboard data={data} setData={setData} setTab={setTab} />}
        {tab === "inbound" && <InboundView data={data} setData={setData} onNew={openNewInbound} />}
        {tab === "outbound" && <OutboundView data={data} setData={setData} onNew={openNewOutbound} />}
        {tab === "deals" && <DealsView data={data} onNew={openNewDeal} />}
        {tab === "revenue" && <RevenueView data={data} />}
        {tab === "automation" && <AutomationView data={data} />}
      </main>

      {modal === "quick" && <QuickActionModal onClose={() => setModal(null)} onPick={(k) => setModal(k)} />}
      {modal === "inbound" && <NewInboundModal onClose={() => setModal(null)} onSave={addInbound} />}
      {modal === "outbound" && <NewOutboundModal onClose={() => setModal(null)} onSave={addOutbound} />}
      {modal === "deal" && <NewDealModal onClose={() => setModal(null)} onSave={addDeal} />}
      {toast && <Toast msg={toast} onDone={() => setToast(null)} />}
      {importModal && <DataImportModal onClose={() => setImportModal(false)} onImport={handleImport} currentData={data} />}
    </div>
  );
}

function NavItem({ icon, label, badge, active, onClick, disabled }) {
  return (
    <button onClick={onClick} disabled={disabled} style={{
      display: "flex", alignItems: "center", gap: 10,
      padding: "8px 12px", border: "none",
      background: active ? "rgba(255,255,255,0.08)" : "transparent",
      color: disabled ? "rgba(232,230,223,0.3)" : (active ? "#fff" : "rgba(232,230,223,0.78)"),
      borderRadius: 7, fontSize: 13, fontWeight: active ? 600 : 500,
      cursor: disabled ? "not-allowed" : "pointer", letterSpacing: "-0.01em",
      textAlign: "left", justifyContent: "space-between",
    }}>
      <span style={{ display: "inline-flex", alignItems: "center", gap: 10 }}>
        <span style={{ width: 16, fontSize: 11, opacity: 0.7 }}>{icon}</span>
        {label}
      </span>
      {badge != null && <span className="mono" style={{
        fontSize: 10, padding: "1px 6px", borderRadius: 99,
        background: active ? "var(--accent)" : "rgba(255,255,255,0.08)",
        color: active ? "#fff" : "rgba(232,230,223,0.7)", fontWeight: 600,
      }}>{badge}</span>}
    </button>
  );
}

function Header({ tab, data, onNewActivity, onSync, onExport }) {
  const titles = {
    dashboard: { title: "대시보드", sub: "팀 전체 매출·영업 현황 실시간 모니터링" },
    inbound: { title: "인바운드 관리", sub: `2026년 인입 ${data.inbound.length}건 · 오픈비율 ${((data.inbound.filter(i=>i.status==="오픈").length / data.inbound.length) * 100).toFixed(1)}%` },
    outbound: { title: "아웃바운드 관리", sub: `타겟 ${data.outbound.length}개 추적 중` },
    deals: { title: "오픈 딜", sub: `2026년 오픈 ${data.deals.length}개 기업` },
    revenue: { title: "매출 분석", sub: "거래액·매출·매출이익 시뮬레이션" },
    automation: { title: "AI 자동화", sub: "이메일 초안 · 주간보고서 · DB 발굴 — Claude 연동" },
  };
  const t = titles[tab];
  return (
    <div style={{ display: "flex", alignItems: "flex-end", justifyContent: "space-between", marginBottom: 22 }}>
      <div>
        <div style={{ fontSize: 11.5, color: "var(--ink-3)", marginBottom: 4, fontWeight: 500, letterSpacing: "0.02em" }}>
          비즈플러스제휴팀 · 주간관리 · 2026.05.06 (수)
        </div>
        <h1 style={{ margin: 0, fontSize: 26, fontWeight: 700, letterSpacing: "-0.025em" }}>{t.title}</h1>
        <div style={{ fontSize: 13, color: "var(--ink-2)", marginTop: 4 }}>{t.sub}</div>
      </div>
      <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
        <LiveDot />
        <span style={{ fontSize: 11.5, color: "var(--ink-3)" }}>마지막 동기화 방금 전</span>
        <button onClick={onExport} style={{
          background: "var(--pos-soft)", color: "var(--pos)",
          border: "1px solid var(--pos)", padding: "8px 12px",
          borderRadius: 8, fontSize: 12.5, fontWeight: 500, cursor: "pointer",
        }}>↓ JSON 내보내기</button>
        <button onClick={onSync} style={{
          background: "var(--bg-elev)", color: "var(--ink-2)",
          border: "1px solid var(--line)", padding: "8px 12px",
          borderRadius: 8, fontSize: 12.5, fontWeight: 500, cursor: "pointer",
        }}>↗ 엑셀 동기화</button>
        <button onClick={onNewActivity} style={{
          background: "var(--ink)", color: "#fff",
          border: "none", padding: "8px 14px",
          borderRadius: 8, fontSize: 12.5, fontWeight: 500, cursor: "pointer",
        }}>+ 새 활동</button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>

</body>
</html>
