<script type="text/babel">
// Utility helpers shared across the CRM
const KRW = (n, opts = {}) => {
  if (n == null || n === "" || isNaN(n)) return "—";
  const v = Number(n);
  const abs = Math.abs(v);
  if (opts.compact !== false) {
    if (abs >= 1_0000_0000) return (v / 1_0000_0000).toFixed(abs >= 10_0000_0000 ? 1 : 2).replace(/\.0+$/, "") + "억";
    if (abs >= 1_0000) return (v / 1_0000).toFixed(0) + "만";
  }
  return v.toLocaleString("ko-KR");
};
const KRWFull = (n) => (n == null || isNaN(n)) ? "—" : Number(n).toLocaleString("ko-KR") + "원";
const PCT = (n, digits = 1) => (n == null || isNaN(n)) ? "—" : (n * 100).toFixed(digits) + "%";

// Excel serial -> Date
const excelToDate = (s) => {
  if (typeof s !== "number") return null;
  const d = new Date(Date.UTC(1899, 11, 30) + s * 86400000);
  return d;
};
const fmtDate = (s) => {
  const d = excelToDate(s);
  if (!d) return typeof s === "string" ? s : "—";
  return `${String(d.getUTCMonth() + 1).padStart(2, "0")}.${String(d.getUTCDate()).padStart(2, "0")}`;
};
const fmtDateLong = (s) => {
  const d = excelToDate(s);
  if (!d) return "—";
  return `${d.getUTCFullYear()}.${String(d.getUTCMonth() + 1).padStart(2, "0")}.${String(d.getUTCDate()).padStart(2, "0")}`;
};
const daysAgo = (s) => {
  const d = excelToDate(s);
  if (!d) return null;
  const today = new Date(Date.UTC(2026, 4, 6)); // 2026-05-06 (current date per system)
  return Math.floor((today - d) / 86400000);
};

const MONTHS = ["1월","2월","3월","4월","5월","6월","7월","8월","9월","10월","11월","12월"];
const CURRENT_MONTH_IDX = 4; // 5월 (May 2026)

// Aggregations
const summarizeGoals = (goals) => {
  const { monthlyGoal, monthlyActual, cumGoal, cumActual } = goals;
  const ytdActual = monthlyActual.slice(0, CURRENT_MONTH_IDX + 1).reduce((a, b) => a + (Number(b) || 0), 0);
  const ytdGoal = cumGoal[CURRENT_MONTH_IDX] || 0;
  const annualGoal = cumGoal[11] || 0;
  const monthGoal = monthlyGoal[CURRENT_MONTH_IDX] || 0;
  const monthActual = Number(monthlyActual[CURRENT_MONTH_IDX]) || 0;
  return { ytdActual, ytdGoal, annualGoal, monthGoal, monthActual, ytdRate: ytdGoal ? ytdActual / ytdGoal : 0, monthRate: monthGoal ? monthActual / monthGoal : 0, annualRate: annualGoal ? ytdActual / annualGoal : 0 };
};

// Status colors
const STATUS_META = {
  "오픈":      { fg: "#1d6b48", bg: "#e3f1e8", dot: "#1d6b48", short: "오픈" },
  "도입확정":   { fg: "#2b3aa3", bg: "#e8eafc", dot: "#2b3aa3", short: "확정" },
  "검토중":     { fg: "#8a6a14", bg: "#f5edd6", dot: "#c79518", short: "검토" },
  "보류":       { fg: "#6c5b3c", bg: "#ecead9", dot: "#a89868", short: "보류" },
  "실패":       { fg: "#a83b2c", bg: "#f6e4e0", dot: "#a83b2c", short: "실패" },
  "미컨택":     { fg: "#4a4842", bg: "#ecead9", dot: "#8a8780", short: "미컨택" },
};

Object.assign(window, { KRW, KRWFull, PCT, excelToDate, fmtDate, fmtDateLong, daysAgo, MONTHS, CURRENT_MONTH_IDX, summarizeGoals, STATUS_META });

</script>

const Card = ({ children, style, padding = 20, ...rest }) => (
  <div {...rest} style={{
    background: "var(--bg-elev)",
    borderRadius: "var(--radius)",
    border: "1px solid var(--line)",
    padding,
    ...style,
  }}>{children}</div>
);

const Sparkline = ({ values, goals, height = 36, width = 220, accent = "var(--accent)" }) => {
  const all = [...values, ...(goals || [])].map(Number).filter(v => !isNaN(v) && v > 0);
  const max = Math.max(...all, 1);
  const w = width, h = height, n = values.length;
  const stepX = w / (n - 1);
  const path = values.map((v, i) => {
    const num = Number(v) || 0;
    return `${i === 0 ? "M" : "L"} ${i * stepX} ${h - (num / max) * (h - 4) - 2}`;
  }).join(" ");
  const fillPath = path + ` L ${(n - 1) * stepX} ${h} L 0 ${h} Z`;
  return (
    <svg width={w} height={h} style={{ display: "block" }}>
      <path d={fillPath} fill={accent} opacity={0.08} />
      {goals && (
        <polyline
          fill="none" stroke="var(--ink-4)" strokeWidth={1} strokeDasharray="2 3"
          points={goals.map((g, i) => `${i * stepX},${h - (Number(g) / max) * (h - 4) - 2}`).join(" ")}
        />
      )}
      <path d={path} fill="none" stroke={accent} strokeWidth={1.6} strokeLinecap="round" />
      {values.map((v, i) => {
        const num = Number(v);
        if (!num) return null;
        return <circle key={i} cx={i * stepX} cy={h - (num / max) * (h - 4) - 2} r={1.8} fill={accent} />;
      })}
    </svg>
  );
};

const ProgressBar = ({ value, target, color = "var(--accent)", height = 6, label }) => {
  const pct = Math.max(0, Math.min(2, target ? value / target : 0));
  const overflow = pct > 1;
  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
      {label && (
        <div style={{ display: "flex", justifyContent: "space-between", fontSize: 11, color: "var(--ink-3)" }}>
          <span>{label}</span>
          <span className="mono" style={{ color: overflow ? "var(--pos)" : "var(--ink-2)", fontWeight: 600 }}>{(pct * 100).toFixed(1)}%</span>
        </div>
      )}
      <div style={{ position: "relative", height, background: "var(--bg-sunken)", borderRadius: 99 }}>
        <div style={{
          width: `${Math.min(pct, 1) * 100}%`, height: "100%",
          background: color, borderRadius: 99,
          transition: "width 600ms cubic-bezier(.2,.8,.2,1)",
        }} />
        {overflow && (
          <div style={{
            position: "absolute", top: 0, left: 0,
            width: `${Math.min(pct, 2) * 50}%`, height: "100%",
            background: `repeating-linear-gradient(45deg, ${color}, ${color} 4px, rgba(255,255,255,0.4) 4px, rgba(255,255,255,0.4) 8px)`,
            borderRadius: 99,
          }} />
        )}
      </div>
    </div>
  );
};

    <div style={{ display: "flex", alignItems: "baseline", gap: 10 }}>

      {hint && <span style={{ fontSize: 12, color: "var(--ink-3)" }}>{hint}</span>}

    {action}

Object.assign(window, { Pill, StatusPill, Card, Sparkline, ProgressBar, SectionTitle, IconBtn, Avatar, LiveDot, SortableTh });

function SortableTh({ children, sortKey, sort, setSort, align }) {
  const active = sort.key === sortKey;
  const arrow = !active ? "↕" : sort.dir === "asc" ? "↑" : "↓";
  return (
    <th onClick={() => setSort({ key: sortKey, dir: active && sort.dir === "desc" ? "asc" : "desc" })}
      style={{
        textAlign: align || "left", fontSize: 10.5, fontWeight: 500,
        color: active ? "var(--ink)" : "var(--ink-3)",
        padding: "10px 14px", letterSpacing: "0.04em", textTransform: "uppercase",
        cursor: "pointer", userSelect: "none", whiteSpace: "nowrap",
      }}
      onMouseEnter={e => e.currentTarget.style.color = "var(--ink)"}
      onMouseLeave={e => e.currentTarget.style.color = active ? "var(--ink)" : "var(--ink-3)"}>
      {children}
      <span style={{ marginLeft: 6, opacity: active ? 1 : 0.4, fontSize: 10 }}>{arrow}</span>
    </th>
  );
}

<script type="text/babel">

const { useState: useStateD, useMemo: useMemoD } = React;

function Dashboard({ data, setTab }) {
  const { deals, inbound, outbound, goals } = data;
  const summary = summarizeGoals(goals);
  const monthIdx = CURRENT_MONTH_IDX;

  // Aggregate by channel
  const channelStats = useMemoD(() => {
    const out = { 인바운드: 0, 아웃바운드: 0 };
    deals.forEach(d => { if (out[d.channel] != null) out[d.channel] += d.monthly || 0; });
    return out;
  }, [deals]);

  // Aggregate by owner (this year monthly)
  const ownerStats = useMemoD(() => {
    const map = {};
    deals.forEach(d => {
      const k = d.owner || "기타";
      if (!map[k]) map[k] = { monthly: 0, count: 0, type: {} };
      map[k].monthly += d.monthly || 0;
      map[k].count += 1;
      map[k].type[d.type] = (map[k].type[d.type] || 0) + 1;
    });
    return map;
  }, [deals]);

  // Inbound funnel
  const funnel = useMemoD(() => {
    const order = ["검토중", "도입확정", "오픈", "보류", "실패"];
    const counts = {};
    inbound.forEach(i => { counts[i.status] = (counts[i.status] || 0) + 1; });
    return order.map(k => ({ key: k, count: counts[k] || 0 }));
  }, [inbound]);

  // Recent inbound (last 12 by inflowDate)
  const recent = useMemoD(() => {
    return [...inbound]
      .filter(i => typeof i.inflowDate === "number")
      .sort((a, b) => b.inflowDate - a.inflowDate)
      .slice(0, 8);
  }, [inbound]);

  // Top deals this period
  const topDeals = useMemoD(() => {
    return [...deals].sort((a, b) => (b.monthly || 0) - (a.monthly || 0)).slice(0, 6);
  }, [deals]);

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 20 }}>
      {/* Hero KPIs */}
      <div style={{ display: "grid", gridTemplateColumns: "1.4fr 1fr 1fr 1fr", gap: 14 }}>
        <HeroKpiCard summary={summary} goals={goals} />

          label="이번 달 신규 거래액"
          value={KRW(summary.monthActual)}
          sub={<span>목표 {KRW(summary.monthGoal)}</span>}
          rate={summary.monthRate}
          chart={<Sparkline width={180} height={32} values={goals.monthlyActual} goals={goals.monthlyGoal} />}
        />
        <KpiCard
          label="누적 달성률"
          value={(summary.ytdRate * 100).toFixed(1) + "%"}
          sub={<span>{KRW(summary.ytdActual)} / {KRW(summary.ytdGoal)}</span>}
          rate={summary.ytdRate}
          chart={
            <div style={{ display: "flex", gap: 3, alignItems: "flex-end", height: 32, width: 180 }}>
              {goals.monthlyGoal.map((g, i) => {
                const a = Number(goals.monthlyActual[i]) || 0;
                const max = Math.max(...goals.monthlyGoal, ...goals.monthlyActual.map(x => Number(x) || 0));
                return (

                    <div style={{ height: `${(a / max) * 100}%`, background: i === monthIdx ? "var(--accent)" : "var(--ink-2)", borderRadius: 1 }} title={`${MONTHS[i]} ${KRW(a)}`} />
                  </div>
                );
              })}
            </div>
          }
        />
        <KpiCard
          label="활성 파이프라인"
          value={`${funnel[0].count + funnel[1].count}건`}
          sub={<span>예상 가치 {KRW(estimatePipelineValue(inbound, outbound))}</span>}
          rate={null}

function MonthlyTrajectory({ goals, monthIdx }) {
  const max = Math.max(...goals.monthlyGoal, ...goals.monthlyActual.map(x => Number(x) || 0));
  const height = 180;
  const colW = 100 / 12;
  return (
    <div style={{ position: "relative", height: height + 40, marginTop: 8 }}>
      {/* Grid */}
      <svg width="100%" height={height} style={{ position: "absolute", top: 0, left: 0 }}>
        {[0.25, 0.5, 0.75].map(y => (
          <line key={y} x1="0" x2="100%" y1={height * (1 - y)} y2={height * (1 - y)} stroke="var(--line-soft)" strokeDasharray="2 4" />
        ))}
        {/* Goal line */}
        <polyline
          fill="none" stroke="var(--ink-4)" strokeWidth={1.4} strokeDasharray="4 4"
          points={goals.monthlyGoal.map((g, i) => {
            const x = (i + 0.5) * (100 / 12);
            const y = height - (Number(g) / max) * (height - 12) - 6;
            return `${x}%,${y}`;
          }).join(" ")}
          vectorEffect="non-scaling-stroke"
        />
      </svg>
      {/* Bars */}
      <div style={{ position: "absolute", bottom: 40, left: 0, right: 0, display: "flex", height }}>
        {goals.monthlyGoal.map((g, i) => {
          const a = Number(goals.monthlyActual[i]) || 0;
          const aH = (a / max) * (height - 12);
          const gH = (Number(g) / max) * (height - 12);
          const isPast = i <= monthIdx;
          const isCurrent = i === monthIdx;
          const rate = g ? a / g : 0;
          const fillColor = !isPast ? "var(--bg-sunken)" : (rate >= 1 ? "var(--accent)" : rate >= 0.7 ? "#7d8ad4" : "var(--warn)");
          return (
            <div key={i} style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "flex-end", position: "relative", gap: 2, paddingInline: 4 }}>
              {isPast && (
                <span style={{ fontSize: 10, color: rate >= 1 ? "var(--pos)" : "var(--ink-3)", fontWeight: 600, marginBottom: 2 }} className="mono">{(rate * 100).toFixed(0)}%</span>
              )}
              <div style={{ width: "100%", maxWidth: 36, height: aH, background: fillColor, borderRadius: "4px 4px 0 0", position: "relative", border: isCurrent ? "1px solid var(--accent)" : "none" }} title={`${MONTHS[i]}: ${KRW(a)} / 목표 ${KRW(g)}`} />
            </div>
          );
        })}
      </div>
      {/* Month labels */}
      <div style={{ position: "absolute", bottom: 0, left: 0, right: 0, display: "flex", height: 32 }}>
        {MONTHS.map((m, i) => (
          <div key={m} style={{ flex: 1, textAlign: "center", paddingTop: 8 }}>
            <div style={{ fontSize: 11, color: i === monthIdx ? "var(--ink)" : "var(--ink-3)", fontWeight: i === monthIdx ? 600 : 400 }}>{m}</div>
            <div className="mono" style={{ fontSize: 9, color: "var(--ink-4)", marginTop: 2 }}>{KRW(goals.monthlyGoal[i])}</div>
          </div>
        ))}
      </div>
    </div>
  );
}

const Th = ({ children, align }) => (
  <th style={{ textAlign: align || "left", fontSize: 11, fontWeight: 500, color: "var(--ink-3)", padding: "10px 16px", letterSpacing: "0.02em", textTransform: "uppercase" }}>{children}</th>

const Td = ({ children, align, mono, bold }) => (
  <td style={{ textAlign: align || "left", padding: "12px 16px", fontSize: 13, fontWeight: bold ? 600 : 400, fontFamily: mono ? "JetBrains Mono" : "inherit", letterSpacing: mono ? "-0.01em" : 0 }}>{children}</td>
);

function estimatePipelineValue(inbound, outbound) {
  // rough heuristic: parse numbers from `detail` strings
  const sum = arr => arr.reduce((a, x) => {
    const m = (x.detail || "").match(/연\s*([\d,]+)\s*만/);
    if (m) return a + parseInt(m[1].replace(/,/g, ""), 10) * 10000;
    const m2 = (x.detail || "").match(/월\s*([\d,]+)\s*만/);
    if (m2) return a + parseInt(m2[1].replace(/,/g, ""), 10) * 10000 * 12;
    return a + (x.employees > 0 ? x.employees * 200000 * 12 : 0);
  }, 0);
  return sum(inbound.filter(i => i.status === "검토중" || i.status === "도입확정")) + sum(outbound) * 0.3;
}

<script type="text/babel">
/* eslint-disable */
const { useState: useStateI, useMemo: useMemoI } = React;

function InboundView({ data, setData, onNew }) {
  const [filter, setFilter] = useStateI({ status: "전체", owner: "전체", service: "전체", region: "전체", month: "전체", q: "" });
  const [sort, setSort] = useStateI({ key: "inflowDate", dir: "desc" });
  const [view, setView] = useStateI("kanban"); // kanban | list
  const [editItem, setEditItem] = useStateI(null);

  const handleSaveEdit = (updated) => {
    const next = data.inbound.map(i => i.name === updated.name ? updated : i);
    setData({ ...data, inbound: next });
  };

  const filtered = useMemoI(() => {
    const arr = data.inbound.filter(r => {
      if (filter.status !== "전체" && r.status !== filter.status) return false;
      if (filter.owner !== "전체" && r.owner !== filter.owner) return false;
      if (filter.service !== "전체" && r.service !== filter.service) return false;
      if (filter.region !== "전체" && !(r.region || "").includes(filter.region)) return false;
      if (filter.month !== "전체" && r.month !== filter.month) return false;
      if (filter.q) {
        const q = filter.q.toLowerCase();
        const hay = `${r.name || ""} ${r.contactName || ""} ${r.detail || ""} ${r.region || ""}`.toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });
    const dir = sort.dir === "asc" ? 1 : -1;
    return arr.sort((a, b) => {
      const av = a[sort.key], bv = b[sort.key];
      if (typeof av === "number" || typeof bv === "number") return ((Number(av) || 0) - (Number(bv) || 0)) * dir;
      return String(av || "").localeCompare(String(bv || "")) * dir;
    });
  }, [data.inbound, filter, sort]);

  const resetFilters = () => setFilter({ status: "전체", owner: "전체", service: "전체", region: "전체", month: "전체", q: "" });
  const activeFilterCount = Object.entries(filter).filter(([k, v]) => v && v !== "전체").length;

  const owners = ["전체", ...Array.from(new Set(data.inbound.map(i => i.owner).filter(Boolean)))];
  const services = ["전체", ...Array.from(new Set(data.inbound.map(i => i.service).filter(Boolean)))];
  const regions = ["전체", ...Array.from(new Set(data.inbound.map(i => (i.region || "").split(" ")[0]).filter(Boolean)))];
  const months = ["전체", ...Array.from(new Set(data.inbound.map(i => i.month).filter(Boolean)))];

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
      {/* Toolbar */}
      <Card padding={14} style={{ display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
        <div style={{ position: "relative", flex: "1 1 220px" }}>
          <span style={{ position: "absolute", left: 11, top: "50%", transform: "translateY(-50%)", color: "var(--ink-4)", fontSize: 12 }}>⌕</span>
          <input
            placeholder="기업명·담당자·내용 검색…"
            value={filter.q}
            onChange={e => setFilter({ ...filter, q: e.target.value })}
            style={{
              width: "100%", border: "1px solid var(--line)", borderRadius: 8,
              padding: "8px 12px 8px 30px", fontSize: 13, fontFamily: "inherit",
              background: "var(--bg-sunken)", boxSizing: "border-box",
            }}
          />
        </div>
        <Select value={filter.status} onChange={v => setFilter({ ...filter, status: v })}
          options={["전체", "검토중", "도입확정", "오픈", "보류", "실패"]} label="상태" />
        <Select value={filter.owner} onChange={v => setFilter({ ...filter, owner: v })} options={owners} label="담당" />
        <Select value={filter.service} onChange={v => setFilter({ ...filter, service: v })} options={services} label="서비스" />
        <Select value={filter.region} onChange={v => setFilter({ ...filter, region: v })} options={regions} label="지역" />
        <Select value={filter.month} onChange={v => setFilter({ ...filter, month: v })} options={months} label="월" />
        {activeFilterCount > 0 && (
          <button onClick={resetFilters} style={{ background: "transparent", color: "var(--neg)", border: "none", fontSize: 12, cursor: "pointer", fontWeight: 500 }}>
            초기화 ({activeFilterCount})
          </button>
        )}
        <div style={{ flex: 1 }} />
        <span style={{ fontSize: 11.5, color: "var(--ink-3)" }}>{filtered.length}건</span>
        <div style={{ display: "flex", gap: 4, padding: 3, background: "var(--bg-sunken)", borderRadius: 8 }}>
          <ToggleBtn active={view === "kanban"} onClick={() => setView("kanban")}>칸반</ToggleBtn>
          <ToggleBtn active={view === "list"} onClick={() => setView("list")}>리스트</ToggleBtn>
        </div>
        <button onClick={onNew} style={{
          background: "var(--ink)", color: "#fff", border: "none",
          padding: "8px 14px", borderRadius: 8, fontWeight: 500, cursor: "pointer", fontSize: 13,

      {/* Stats strip */}
      <div style={{ display: "grid", gridTemplateColumns: "repeat(5, 1fr)", gap: 10 }}>

            </Card>
          );
        })}
      </div>

      {view === "kanban" ? <Kanban items={filtered} setData={setData} data={data} onEdit={setEditItem} /> : <ListView items={filtered} sort={sort} setSort={setSort} onEdit={setEditItem} />}
      {editItem && <EditInboundModal item={editItem} onClose={() => setEditItem(null)} onSave={(u) => { handleSaveEdit(u); setEditItem(null); }} />}
    </div>
  );
}

function Kanban({ items, setData, data, onEdit }) {

  return (
    <div style={{ display: "grid", gridTemplateColumns: "repeat(5, 1fr)", gap: 10, alignItems: "flex-start" }}>
      {cols.map(col => {
        const colItems = items.filter(i => i.status === col).slice(0, 30);
        const m = STATUS_META[col];
        return (
          <div key={col}
            onDragOver={e => { e.preventDefault(); setDragOver(col); }}
            onDragLeave={() => setDragOver(null)}
            onDrop={e => {
              const idx = Number(e.dataTransfer.getData("text/idx"));
              const next = [...data.inbound];
              if (next[idx]) next[idx] = { ...next[idx], status: col };
              setData({ ...data, inbound: next });
              setDragOver(null);

            style={{
              background: dragOver === col ? "var(--bg-elev)" : "var(--bg-sunken)",
              borderRadius: 10, padding: 8, minHeight: 200,
              border: dragOver === col ? `1.5px dashed ${m.dot}` : "1px solid transparent",

            }}>
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "6px 8px 12px" }}>
              <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                <span style={{ width: 8, height: 8, borderRadius: 999, background: m.dot }} />
                <span style={{ fontSize: 12, fontWeight: 600 }}>{col}</span>
                <span className="mono" style={{ fontSize: 11, color: "var(--ink-3)" }}>{items.filter(i => i.status === col).length}</span>

                return (
                  <div key={i} draggable
                    onDragStart={e => e.dataTransfer.setData("text/idx", String(realIdx))}
                    style={{
                      background: "#fff", padding: 12, borderRadius: 8,
                      border: "1px solid var(--line)", boxShadow: "var(--shadow-1)",
                      cursor: "grab",
                    }}>
                    <div style={{ fontSize: 12.5, fontWeight: 600, lineHeight: 1.3, marginBottom: 4 }}>{item.name}</div>
                    <div style={{ fontSize: 10.5, color: "var(--ink-3)", marginBottom: 8, lineHeight: 1.4 }}>
                      {item.region || "—"} · {item.employees}명 · {item.service}
                    </div>
                    {item.detail && (
                      <div style={{ fontSize: 10.5, color: "var(--ink-2)", marginBottom: 8, lineHeight: 1.4, display: "-webkit-box", WebkitLineClamp: 2, WebkitBoxOrient: "vertical", overflow: "hidden" }}>
                        {item.detail}
                      </div>
                    )}
                    <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", borderTop: "1px solid var(--line-soft)", paddingTop: 6 }}>
                      <Avatar name={item.owner} size={18} />
                      <span className="mono" style={{ fontSize: 10, color: "var(--ink-4)" }}>
                        {fmtDate(item.inflowDate)}

                    </div>
                  </div>
                );
              })}
              {items.filter(i => i.status === col).length > 30 && (
                <div style={{ textAlign: "center", padding: 8, fontSize: 11, color: "var(--ink-3)" }}>+ {items.filter(i => i.status === col).length - 30}건 더보기</div>
              )}
            </div>
          </div>
        );
      })}
    </div>
  );
}

function ListView({ items, sort, setSort }) {

<script type="text/babel">
/* eslint-disable */
const { useState: useStateO, useMemo: useMemoO } = React;

function OutboundView({ data, setData, onNew }) {
  const [q, setQ] = useStateO("");
  const [region, setRegion] = useStateO("전체");
  const [service, setService] = useStateO("전체");
  const [status, setStatus] = useStateO("전체");
  const [sort, setSort] = useStateO({ key: "lastUpdate", dir: "desc" });
  const [editItem, setEditItem] = useStateO(null);

  const handleSaveEdit = (updated) => {
    const next = data.outbound.map(i => i.name === updated.name ? updated : i);
    setData({ ...data, outbound: next });
  };

  const inferStatus = (r) => {
    if (r.lastUpdate === "미컨택") return "미컨택";
    const d = r.detail || "";
    if (d.includes("오픈확정") || d.includes("미팅예정")) return "미팅 예정";
    if (d.includes("미팅완료") || d.includes("오픈 목표")) return "오픈 확정";
    if (d.includes("검토")) return "검토 중";
    if (d.includes("신규컨택") || d.includes("제안")) return "신규 컨택";
    return "검토 중";
  };

  const filtered = useMemoO(() => {
    const arr = data.outbound.filter(r => {
      if (q) {
        const hay = `${r.name || ""} ${r.contactName || ""} ${r.detail || ""} ${r.note || ""}`.toLowerCase();
        if (!hay.includes(q.toLowerCase())) return false;
      }
      if (region !== "전체" && !(r.region || "").includes(region)) return false;
      if (service !== "전체" && r.service !== service) return false;
      if (status !== "전체" && inferStatus(r) !== status) return false;
      return true;
    });
    const dir = sort.dir === "asc" ? 1 : -1;
    return arr.sort((a, b) => {
      let av = a[sort.key], bv = b[sort.key];
      if (sort.key === "lastUpdate") {
        av = av === "미컨택" ? 0 : (Number(av) || 0);
        bv = bv === "미컨택" ? 0 : (Number(bv) || 0);
      }
      if (sort.key === "employees") {
        av = av === "-" ? 0 : (Number(av) || 0);
        bv = bv === "-" ? 0 : (Number(bv) || 0);
      }
      if (typeof av === "number" || typeof bv === "number") return ((Number(av) || 0) - (Number(bv) || 0)) * dir;
      return String(av || "").localeCompare(String(bv || "")) * dir;
    });
  }, [data.outbound, q, region, service, status, sort]);

  const regions = ["전체", ...Array.from(new Set(data.outbound.map(o => (o.region || "").split(" ")[0]).filter(Boolean)))];
  const services = ["전체", ...Array.from(new Set(data.outbound.map(o => o.service).filter(Boolean)))];
  const statuses = ["전체", "미팅 예정", "오픈 확정", "검토 중", "신규 컨택", "미컨택"];

  // Group by status (parsed from detail/lastUpdate)
  const grouped = useMemoO(() => {
    const groups = { "미팅 예정": [], "오픈 확정": [], "검토 중": [], "신규 컨택": [], "미컨택": [] };
    filtered.forEach(r => groups[inferStatus(r)].push(r));
    return groups;
  }, [filtered]);

  const activeFilters = [region, service, status].filter(v => v && v !== "전체").length + (q ? 1 : 0);
  const reset = () => { setQ(""); setRegion("전체"); setService("전체"); setStatus("전체"); };

  const SortTh = ({ children, k, align }) => <SortableTh sort={sort} setSort={setSort} sortKey={k} align={align}>{children}</SortableTh>;

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
      <Card padding={14} style={{ display: "flex", gap: 10, alignItems: "center", flexWrap: "wrap" }}>
        <div style={{ position: "relative", flex: "1 1 240px" }}>
          <span style={{ position: "absolute", left: 11, top: "50%", transform: "translateY(-50%)", color: "var(--ink-4)", fontSize: 12 }}>⌕</span>
          <input placeholder="기업명·컨택·내용 검색…" value={q} onChange={e => setQ(e.target.value)}
            style={{ width: "100%", border: "1px solid var(--line)", borderRadius: 8, padding: "8px 12px 8px 30px", fontSize: 13, fontFamily: "inherit", background: "var(--bg-sunken)", boxSizing: "border-box" }} />
        </div>
        <Select value={status} onChange={setStatus} options={statuses} label="상태" />
        <Select value={service} onChange={setService} options={services} label="서비스" />
        <Select value={region} onChange={setRegion} options={regions} label="지역" />
        {activeFilters > 0 && <button onClick={reset} style={{ background: "transparent", color: "var(--neg)", border: "none", fontSize: 12, cursor: "pointer", fontWeight: 500 }}>초기화 ({activeFilters})</button>}
        <div style={{ flex: 1 }} />
        <Pill tone="ghost">{filtered.length} / {data.outbound.length}건</Pill>
        <button onClick={onNew} style={{ background: "var(--ink)", color: "#fff", border: "none", padding: "8px 14px", borderRadius: 8, fontWeight: 500, cursor: "pointer", fontSize: 13 }}>+ 타겟 추가</button>
      </Card>

      {/* Status counts */}
      <div style={{ display: "grid", gridTemplateColumns: "repeat(5, 1fr)", gap: 10 }}>
        {Object.entries(grouped).map(([k, v]) => {
          const tone = k === "오픈 확정" ? "pos" : k === "미팅 예정" ? "accent" : k === "검토 중" ? "warn" : "neutral";
          const isActive = status === k;
          return (
            <Card key={k} padding={14} onClick={() => setStatus(isActive ? "전체" : k)}
              style={{ cursor: "pointer", border: isActive ? "1.5px solid var(--accent)" : "1px solid var(--line)" }}>
              <Pill tone={tone} size="sm">{k}</Pill>
              <div className="mono" style={{ fontSize: 22, fontWeight: 700, marginTop: 8 }}>{v.length}</div>
              <div style={{ fontSize: 11, color: "var(--ink-3)", marginTop: 2 }}>
                임직원 {v.reduce((a, x) => a + (Number(x.employees) || 0), 0).toLocaleString()}명
              </div>
            </Card>
          );
        })}
      </div>

      {/* Table */}
      <Card padding={0}>
        <div style={{ overflow: "auto", maxHeight: 700 }}>
          <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13 }}>
            <thead style={{ position: "sticky", top: 0, background: "var(--bg-sunken)", zIndex: 1 }}>
              <tr>
                <SortTh k="name">기업명</SortTh>
                <SortTh k="region">지역</SortTh>
                <SortTh k="employees" align="right">임직원</SortTh>
                <SortTh k="service">서비스</SortTh>
                <Tho>현황</Tho>
                <SortTh k="lastUpdate">마지막 업데이트</SortTh>
                <SortTh k="contactName">담당자</SortTh>
                <Tho>비고</Tho>
              </tr>
            </thead>
            <tbody>
              {filtered.map((r, i) => {
                const isUncontacted = r.lastUpdate === "미컨택";
                const days = typeof r.lastUpdate === "number" ? daysAgo(r.lastUpdate) : null;
                return (
                  <tr key={i} onClick={() => setEditItem(r)} style={{ borderBottom: "1px solid var(--line-soft)", cursor: "pointer" }} title="클릭하여 편집">
                    <Tdo><div style={{ fontWeight: 500 }}>{r.name}</div></Tdo>
                    <Tdo>{r.region || "—"}</Tdo>
                    <Tdo align="right" mono>{r.employees === "-" ? "—" : r.employees}</Tdo>
                    <Tdo><Pill tone={String(r.service).includes("복지") ? "accent" : "warn"} size="sm">{r.service}</Pill></Tdo>
                    <Tdo>
                      <span style={{ display: "-webkit-box", WebkitLineClamp: 1, WebkitBoxOrient: "vertical", overflow: "hidden", color: "var(--ink-2)" }}>{r.detail}</span>
                    </Tdo>
                    <Tdo>
                      {isUncontacted ? <Pill tone="neg" size="sm">미컨택</Pill> :
                       days != null ? (
                         <span className="mono" style={{ fontSize: 12, color: days > 30 ? "var(--neg)" : days > 14 ? "var(--warn)" : "var(--ink-2)" }}>
                           {fmtDate(r.lastUpdate)}
                           <span style={{ color: "var(--ink-4)", marginLeft: 6 }}>{days}일 전</span>
                         </span>
                       ) : "—"}
                    </Tdo>
                    <Tdo>
                      {r.contactName ? (
                        <div>
                          <div style={{ fontSize: 12.5, fontWeight: 500 }}>{r.contactName}</div>
                          <div className="mono" style={{ fontSize: 10.5, color: "var(--ink-3)" }}>{r.phone}</div>
                        </div>
                      ) : <span style={{ color: "var(--ink-4)" }}>—</span>}
                    </Tdo>
                    <Tdo><span style={{ color: "var(--ink-3)", fontSize: 12 }}>{r.note}</span></Tdo>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      </Card>
      {editItem && <EditOutboundModal item={editItem} onClose={() => setEditItem(null)} onSave={(u) => { handleSaveEdit(u); setEditItem(null); }} />}
    </div>
  );
}

const Tho = ({ children, align }) => (
  <th style={{ textAlign: align || "left", fontSize: 10.5, fontWeight: 500, color: "var(--ink-3)", padding: "12px 14px", letterSpacing: "0.04em", textTransform: "uppercase" }}>{children}</th>
);
const Tdo = ({ children, align, mono }) => (
  <td style={{ textAlign: align || "left", padding: "12px 14px", fontSize: 12.5, fontFamily: mono ? "JetBrains Mono" : "inherit" }}>{children}</td>
);

Object.assign(window, { OutboundView });

</script>

<script type="text/babel">
/* eslint-disable */
const { useState: useStateD2, useMemo: useMemoD2 } = React;

function DealsView({ data, onNew }) {
  const [type, setType] = useStateD2("전체");
  const [channel, setChannel] = useStateD2("전체");
  const [service, setService] = useStateD2("전체");
  const [owner, setOwner] = useStateD2("전체");
  const [q, setQ] = useStateD2("");
  const [sort, setSort] = useStateD2({ key: "monthly", dir: "desc" });

  const filtered = useMemoD2(() => {
    const arr = data.deals
      .filter(d => type === "전체" || d.type === type)
      .filter(d => channel === "전체" || d.channel === channel)
      .filter(d => service === "전체" || d.service === service)
      .filter(d => owner === "전체" || d.owner === owner)
      .filter(d => {
        if (!q) return true;
        const hay = `${d.name || ""} ${d.code || ""} ${d.industry || ""} ${d.region || ""}`.toLowerCase();
        return hay.includes(q.toLowerCase());
      });
    const dir = sort.dir === "asc" ? 1 : -1;
    return arr.sort((a, b) => {
      let av = a[sort.key], bv = b[sort.key];
      if (sort.key === "employees") {
        av = av === "-" ? 0 : (Number(av) || 0);
        bv = bv === "-" ? 0 : (Number(bv) || 0);
      }
      if (typeof av === "number" || typeof bv === "number") return ((Number(av) || 0) - (Number(bv) || 0)) * dir;
      return String(av || "").localeCompare(String(bv || "")) * dir;
    });
  }, [data.deals, type, channel, service, owner, q, sort]);

  const totalMonthly = filtered.reduce((a, d) => a + (d.monthly || 0), 0);

  const SortTh = ({ children, k, align }) => <SortableTh sort={sort} setSort={setSort} sortKey={k} align={align}>{children}</SortableTh>;

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
      <Card padding={14} style={{ display: "flex", gap: 10, alignItems: "center", flexWrap: "wrap" }}>

          <span style={{ position: "absolute", left: 11, top: "50%", transform: "translateY(-50%)", color: "var(--ink-4)", fontSize: 12 }}>⌕</span>
          <input placeholder="기업명·코드·업종 검색…" value={q} onChange={e => setQ(e.target.value)}
            style={{ width: "100%", border: "1px solid var(--line)", borderRadius: 8, padding: "8px 12px 8px 30px", fontSize: 13, fontFamily: "inherit", background: "var(--bg-sunken)", boxSizing: "border-box" }} />
        </div>
        <Select value={type} onChange={setType} options={["전체", "공항", "로컬"]} label="유형" />

        <Select value={service} onChange={setService} options={services} label="서비스" />
        <Select value={owner} onChange={setOwner} options={owners} label="담당" />
        {activeFilters > 0 && <button onClick={reset} style={{ background: "transparent", color: "var(--neg)", border: "none", fontSize: 12, cursor: "pointer", fontWeight: 500 }}>초기화 ({activeFilters})</button>}
        <div style={{ flex: 1 }} />
        <span style={{ fontSize: 12, color: "var(--ink-3)" }}>월 거래 합계</span>
        <span className="mono" style={{ fontSize: 14, fontWeight: 700, color: "var(--accent)" }}>{KRW(totalMonthly)}</span>
        <button onClick={onNew} style={{ background: "var(--ink)", color: "#fff", border: "none", padding: "8px 14px", borderRadius: 8, fontWeight: 500, cursor: "pointer", fontSize: 13 }}>+ 신규 오픈</button>
      </Card>

        <MiniKpi label={`오픈 기업수${activeFilters ? " (필터됨)" : ""}`} value={filtered.length + "건"} />
        <MiniKpi label="월 거래액 합계" value={KRW(totalMonthly)} />
        <MiniKpi label="연 거래액 합계" value={KRW(totalAnnual)} />
        <MiniKpi label="평균 임직원" value={Math.round(filtered.reduce((a, d) => a + (Number(d.employees) || 0), 0) / Math.max(filtered.length, 1)) + "명"} />
      </div>

      <Card padding={0}>
        <div style={{ overflow: "auto", maxHeight: 700 }}>
          <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13 }}>

                <SortTh k="type">유형</SortTh>
                <SortTh k="channel">채널</SortTh>
                <SortTh k="service">서비스</SortTh>
                <SortTh k="region">지역</SortTh>
                <SortTh k="employees" align="right">임직원</SortTh>
                <SortTh k="monthly" align="right">월 거래</SortTh>
                <SortTh k="annual" align="right">연 거래</SortTh>
                <SortTh k="owner">담당</SortTh>
                <Thd>비고</Thd>
              </tr>
            </thead>
            <tbody>

// 헤더 정규화: 공백 제거 + 소문자
function normalizeHeader(h) {
  return String(h||'').replace(/\s/g,'').toLowerCase();
}

function buildNormMap(colMap) {
  const m = {};
  Object.entries(colMap).forEach(([k,v]) => { m[k.replace(/\s/g,'').toLowerCase()] = v; });
  return m;
}

function parseSheet(rows, colMap) {
  if (!rows || rows.length < 2) return [];
  const normMap = buildNormMap(colMap);
  const rawHeaders = rows[0];
  const headers = rawHeaders.map(h => normalizeHeader(h));
  const parsed = rows.slice(1)
    .filter(row => row.some(c => c != null && String(c).trim() !== ''))
    .map(row => {
      const obj = {};
      headers.forEach((h, i) => {
        const field = normMap[h];
        if (field) obj[field] = row[i] != null ? String(row[i]).trim() : '';
      });
      return obj;
    })
    .filter(obj => obj.name && obj.name !== '');
  return parsed;
}

// 시트 타입 자동 감지
function detectSheetType(sheetName, headers) {
  const n = sheetName.replace(/\s/g,'').toLowerCase();
  if (n.includes('인바운드')||n.includes('inbound')) return 'inbound';
  if (n.includes('아웃바운드')||n.includes('outbound')) return 'outbound';
  if (n.includes('딜')||n.includes('deal')||n.includes('오픈')) return 'deals';
  // 헤더로 타입 추론
  const normH = headers.map(h=>normalizeHeader(h));
  if (normH.includes('월거래액')||normH.includes('월거래')||normH.includes('monthly')) return 'deals';
  if (normH.includes('업종')||normH.includes('industry')) return 'outbound';
  return 'inbound';
}

async function parseExcelFile(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      try {
        const XLSX = window.XLSX;
        const wb = XLSX.read(e.target.result, { type:'array', cellDates: true });
        const result = { inbound:[], outbound:[], deals:[], _debug:[] };
        wb.SheetNames.forEach(name => {
          const ws = wb.Sheets[name];
          const rows = XLSX.utils.sheet_to_json(ws, { header:1, defval:'' });
          if (!rows || rows.length < 2) { result._debug.push(`시트 "${name}": 데이터 없음`); return; }
          const type = detectSheetType(name, rows[0]);
          const mapRef = { inbound:INBOUND_MAP, outbound:OUTBOUND_MAP, deals:DEALS_MAP }[type];
          const parsed = parseSheet(rows, mapRef);
          result[type] = [...(result[type]||[]), ...parsed];
          result._debug.push(`시트 "${name}" → ${type} ${parsed.length}건 (전체 ${rows.length-1}행)`);
        });
        resolve(result);
      } catch(err) { reject(err); }
    };
    reader.onerror = reject;
    reader.readAsArrayBuffer(file);
  });
}

function notionPropText(prop) {
  if (!prop) return '';
  if (prop.type==='title') return (prop.title||[]).map(t=>t.plain_text).join('');
  if (prop.type==='rich_text') return (prop.rich_text||[]).map(t=>t.plain_text).join('');
  if (prop.type==='number') return prop.number!=null?String(prop.number):'';
  if (prop.type==='select') return prop.select?.name||'';
  if (prop.type==='date') return prop.date?.start||'';
  if (prop.type==='email') return prop.email||'';
  return '';
}

const NOTION_INBOUND = {'기업명|회사명|Name':'name','임직원수|직원수|임직원':'employees','지역':'region','서비스':'service','상태|Status':'status','인입일|인입 일자':'inflowDate','담당자':'owner','고객담당자|담당자명':'contactName','이메일':'email','메모|비고|내용':'detail','미팅일':'meetingDate'};
const NOTION_OUTBOUND = {'기업명|회사명|Name':'name','임직원수|직원수':'employees','지역':'region','업종':'industry','서비스':'service','상태|Status':'status','담당자':'owner','메모|비고':'note'};

function mapNotionPage(page, fieldMap) {
  const p=page.properties||{}, obj={};
  Object.entries(fieldMap).forEach(([ks,field])=>{
    for (const k of ks.split('|')) { const v=notionPropText(p[k]); if(v){obj[field]=v;break;} }
  });
  return obj;
}

async function fetchNotionDB(notionKey, dbId) {
  const id=dbId.replace(/-/g,'');
  const fmtId=[id.slice(0,8),id.slice(8,12),id.slice(12,16),id.slice(16,20),id.slice(20)].join('-');
  const res = await fetch(`https://api.notion.com/v1/databases/${fmtId}/query`, {
    method:'POST',
    headers:{'Authorization':`Bearer ${notionKey}`,'Notion-Version':'2022-06-28','Content-Type':'application/json'},
    body:JSON.stringify({page_size:100})
  });
  if (!res.ok) { const err=await res.json().catch(()=>({})); throw new Error(err.message||`HTTP ${res.status}`); }
  return (await res.json()).results||[];
}

function DataImportModal({ onClose, onImport, currentData }) {
  const [tab, setTab] = useStateDM('excel');
  const [dragging, setDragging] = useStateDM(false);
  const [preview, setPreview] = useStateDM(null);
  const [loading, setLoading] = useStateDM(false);
  const [error, setError] = useStateDM('');
  const [importMode, setImportMode] = useStateDM('replace');
  const [notionKey, setNotionKey] = useStateDM(() => { try{return JSON.parse(localStorage.getItem('bizplus_crm_v1')||'{}').notionKey||'';}catch{return '';} });
  const [notionInboundId, setNotionInboundId] = useStateDM('');
  const [notionOutboundId, setNotionOutboundId] = useStateDM('');
  const [notionLoading, setNotionLoading] = useStateDM(false);
  const [notionResult, setNotionResult] = useStateDM(null);
  const fileRef = useRefDM(null);
  const reset = () => { setError(''); setPreview(null); setNotionResult(null); };

  const handleFile = async file => {
    if (!file) return;
    if (!window.XLSX) { setError('XLSX 라이브러리 로딩 중입니다. 잠시 후 다시 시도해주세요.'); return; }
    setLoading(true); reset();
    try { setPreview(await parseExcelFile(file)); }
    catch(e) { setError('파일 파싱 실패: '+e.message); }
    finally { setLoading(false); }
  };

  const syncNotion = async () => {
    if (!notionKey) { setError('Notion 키를 입력해주세요'); return; }
    if (!notionInboundId && !notionOutboundId) { setError('최소 하나의 DB ID를 입력해주세요'); return; }
    setNotionLoading(true); reset();
    const result = { inbound:[], outbound:[], deals:[] };
    try {
      if (notionInboundId) { const rows=await fetchNotionDB(notionKey,notionInboundId); result.inbound=rows.map(p=>mapNotionPage(p,NOTION_INBOUND)).filter(r=>r.name); }
      if (notionOutboundId) { const rows=await fetchNotionDB(notionKey,notionOutboundId); result.outbound=rows.map(p=>mapNotionPage(p,NOTION_OUTBOUND)).filter(r=>r.name); }
      setNotionResult(result);
    } catch(e) {
      const m=e.message||'';
      setError(m.includes('fetch')||m.includes('CORS')||m.includes('network')
        ? 'Notion API CORS 차단됨\n→ Notion DB → ··· → 내보내기 → CSV 저장 후 엑셀 업로드 탭에서 업로드해 주세요'
        : 'Notion 오류: '+m);
    } finally { setNotionLoading(false); }
  };

  const doImport = () => {
    const src=preview||notionResult; if(!src) return;
    let d={...currentData};
    const merge=(arr,n)=>{const ex=new Set(arr.map(i=>i.name));return [...arr,...(n||[]).filter(i=>!ex.has(i.name))];};
    if(importMode==='replace'){if(src.inbound?.length)d.inbound=src.inbound;if(src.outbound?.length)d.outbound=src.outbound;if(src.deals?.length)d.deals=src.deals;}
    else{if(src.inbound?.length)d.inbound=merge(d.inbound,src.inbound);if(src.outbound?.length)d.outbound=merge(d.outbound,src.outbound);if(src.deals?.length)d.deals=merge(d.deals,src.deals);}
    onImport(d); onClose();
  };

  const src=preview||notionResult;
  const ib=src?.inbound?.length||0, ob=src?.outbound?.length||0, dl=src?.deals?.length||0, total=ib+ob+dl;

  return (
    <Modal onClose={onClose} title="데이터 가져오기" size="lg">
      <div style={{display:'flex',gap:4,marginBottom:18,padding:3,background:'var(--bg-sunken)',borderRadius:9}}>
        {[['excel','📊 엑셀 업로드'],['notion','🔗 Notion 동기화']].map(([k,l])=>(

        ))}

        <div style={{display:'flex',flexDirection:'column',gap:10}}>
          <div onDragOver={e=>{e.preventDefault();setDragging(true);}} onDragLeave={()=>setDragging(false)} onDrop={e=>{e.preventDefault();setDragging(false);handleFile(e.dataTransfer.files[0]);}} onClick={()=>fileRef.current?.click()} style={{border:`2px dashed ${dragging?'var(--accent)':'var(--line)'}`,borderRadius:10,padding:'28px 20px',textAlign:'center',cursor:'pointer',background:dragging?'var(--accent-soft)':'var(--bg-sunken)'}}>

            <div style={{fontSize:26,marginBottom:6}}>📂</div>
            <div style={{fontSize:13,fontWeight:600}}>엑셀 파일을 드래그하거나 클릭해서 업로드</div>
            <div style={{fontSize:11.5,color:'var(--ink-3)',marginTop:4}}>.xlsx · .xls · .csv 지원</div>
          </div>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
            <div style={{fontSize:12,color:'var(--ink-3)'}}>시트명: <strong>인바운드 / 아웃바운드 / 오픈딜</strong></div>
            <button onClick={downloadTemplate} style={{padding:'6px 12px',border:'1px solid var(--line)',borderRadius:7,background:'var(--bg-elev)',cursor:'pointer',fontFamily:'inherit',fontSize:12}}>📥 템플릿 다운로드</button>
          </div>
        </div>
      )}
      {tab==='notion' && (
        <div style={{display:'flex',flexDirection:'column',gap:6}}>
          <Field label="Notion Integration Token"><Input type="password" value={notionKey} onChange={e=>setNotionKey(e.target.value)} placeholder="ntn_…"/></Field>
          <Field label="인바운드 DB ID" hint="선택사항"><Input value={notionInboundId} onChange={e=>setNotionInboundId(e.target.value)} placeholder="xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"/></Field>
          <Field label="아웃바운드 DB ID" hint="선택사항"><Input value={notionOutboundId} onChange={e=>setNotionOutboundId(e.target.value)} placeholder="xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"/></Field>
          <button onClick={syncNotion} disabled={notionLoading} style={{width:'100%',padding:'10px',border:'none',borderRadius:8,fontFamily:'inherit',fontSize:13,fontWeight:600,cursor:notionLoading?'wait':'pointer',background:notionLoading?'var(--bg-sunken)':'var(--ink)',color:notionLoading?'var(--ink-4)':'#fff'}}>{notionLoading?'불러오는 중…':'🔗 Notion DB에서 불러오기'}</button>
          <div style={{padding:'10px 12px',background:'#fffbeb',border:'1px solid #f5d67a',borderRadius:8,fontSize:11.5,color:'#7a5c00',lineHeight:1.7}}>
            <strong>CORS 차단 시 대안</strong> — Notion DB → ··· → 내보내기 → CSV 저장<br/>→ 엑셀 업로드 탭에서 해당 CSV 파일 업로드
          </div>
        </div>
      )}
      {(loading||notionLoading) && <div style={{textAlign:'center',padding:12,color:'var(--ink-3)',fontSize:13,marginTop:10}}>처리 중…</div>}
      {error && <div style={{marginTop:10,padding:'10px 12px',background:'#fff0f0',border:'1px solid #ffb3b3',borderRadius:8,fontSize:12.5,color:'#c00',whiteSpace:'pre-line'}}>{error}</div>}

      {/* 파싱 결과 - 0건일 때도 디버그 정보 표시 */}
      {src && total===0 && !loading && (
        <div style={{marginTop:12,padding:'12px 14px',background:'#fffbeb',border:'1px solid #f5d67a',borderRadius:8,fontSize:12,color:'#7a5c00',lineHeight:1.8}}>
          <strong>⚠ 데이터를 인식하지 못했습니다</strong>
          {src._debug?.length>0 && <div style={{marginTop:4,opacity:0.8}}>{src._debug.join(' · ')}</div>}
          <div style={{marginTop:6}}>
            <div>• 1행에 헤더가 있는지 확인해주세요 (기업명, 임직원수, 지역 ...)</div>
            <div>• 헤더에 <strong>기업명</strong> 또는 <strong>회사명</strong> 컬럼이 반드시 있어야 합니다</div>
            <div>• 아래 <strong>템플릿 다운로드</strong> 후 해당 형식으로 작성해주세요</div>
          </div>
        </div>
      )}

      {src && total>0 && (
        <div style={{marginTop:16,paddingTop:16,borderTop:'1px solid var(--line)'}}>
          <div style={{fontSize:12.5,fontWeight:600,marginBottom:6}}>인식된 데이터</div>
          {src._debug?.length>0 && <div style={{fontSize:11,color:'var(--ink-3)',marginBottom:8}}>{src._debug.join(' · ')}</div>}
          <div style={{display:'flex',gap:8,marginBottom:10,flexWrap:'wrap'}}>
            {[['인바운드',ib],['아웃바운드',ob],['오픈딜',dl]].map(([k,v])=>v>0&&<div key={k} style={{padding:'5px 12px',background:'var(--bg-sunken)',borderRadius:7,fontSize:12}}>{k} <strong style={{color:'var(--accent)'}}>{v}건</strong></div>)}
          </div>
          <div style={{display:'flex',gap:6,marginBottom:12}}>
            {[['replace','기존 데이터 교체'],['merge','새 항목만 추가']].map(([k,l])=>(
              <button key={k} onClick={()=>setImportMode(k)} style={{padding:'6px 12px',borderRadius:7,border:'1px solid',cursor:'pointer',fontFamily:'inherit',fontSize:12,borderColor:importMode===k?'var(--accent)':'var(--line)',background:importMode===k?'var(--accent-soft)':'transparent',color:importMode===k?'var(--accent)':'var(--ink-2)',fontWeight:importMode===k?600:400}}>{l}</button>
            ))}
          </div>
          <PrimaryBtn onClick={doImport} style={{width:'100%',justifyContent:'center'}}>CRM에 {total}건 가져오기</PrimaryBtn>
        </div>
      )}
    </Modal>
  );
}

Object.assign(window, { DataImportModal, downloadTemplate });
</script>

// ── Claude API helper ──────────────────────────────────────────────────────
async function callClaudeApi(apiKey, model, prompt) {

    })
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.error?.message || `Claude API 오류 (HTTP ${res.status})`);
  }
  const data = await res.json();

// ── Notion API helper ──────────────────────────────────────────────────────
async function pushNotionPage(notionKey, pageId, title, content) {
  const cleanId = pageId.replace(/-/g, '');
  const paragraphs = content.split('\n\n').filter(Boolean);
  const blocks = paragraphs.slice(0, 100).map(p => ({
    object: 'block', type: 'paragraph',
    paragraph: { rich_text: [{ type: 'text', text: { content: p.slice(0, 2000) } }] }
  }));
  const res = await fetch('https://api.notion.com/v1/pages', {
    method: 'POST',
    headers: {
      'Authorization': `Bearer ${notionKey}`,
      'Notion-Version': '2022-06-28',
      'Content-Type': 'application/json',
    },
    body: JSON.stringify({
      parent: { page_id: cleanId },
      properties: { title: { title: [{ text: { content: title } }] } },
      children: blocks,
    })
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.message || `Notion 오류 (HTTP ${res.status})`);
  }
  return res.json();
}

- 첫 줄에 "제목: " 으로 표기
- 첫 문장은 반드시 관심을 끄는 훅
- 마무리: 15-20분 전화/미팅 제안
- 서명: NHN페이코 비즈플러스제휴팀
- 바로 발송 가능한 완성된 이메일 전문 작성`;
}

function buildReportPrompt(data, dateLabel) {
  const s = summarizeGoals(data.goals);
  const inb = data.inbound || [];
  const deals = data.deals || [];
  const out = data.outbound || [];
  const ownerStats = {};
  deals.forEach(d => {
    const k = d.owner || '기타';
    if (!ownerStats[k]) ownerStats[k] = { count: 0, monthly: 0 };
    ownerStats[k].count++;
    ownerStats[k].monthly += d.monthly || 0;
  });
  const top5 = [...deals].sort((a,b)=>(b.monthly||0)-(a.monthly||0)).slice(0,5).map(d=>`${d.name} (월 ${KRW(d.monthly)}, ${d.owner})`).join('\n');
  const ibStats = { total: inb.length, 검토중: inb.filter(i=>i.status==='검토중').length, 도입확정: inb.filter(i=>i.status==='도입확정').length, 오픈: inb.filter(i=>i.status==='오픈').length };
  return `당신은 비즈플러스제휴팀 팀장입니다.
아래 영업 현황 데이터로 주간 영업보고서를 Notion 마크다운으로 작성해주세요.

[${dateLabel} 주간 영업 현황]
▪ YTD 누적: ${KRW(s.ytdActual)} / 연목표 ${KRW(s.annualGoal)} (${(s.annualRate*100).toFixed(1)}%)
▪ 이번 달: ${KRW(s.monthActual)} / 목표 ${KRW(s.monthGoal)} (${(s.monthRate*100).toFixed(1)}%)
▪ 인바운드: 총 ${ibStats.total}건 (검토중 ${ibStats.검토중} | 도입확정 ${ibStats.도입확정} | 오픈 ${ibStats.오픈})
▪ 아웃바운드 추적 타겟: ${out.length}개
▪ 오픈 딜 총 ${deals.length}건
${Object.entries(ownerStats).map(([k,v])=>`▪ ${k}: ${v.count}건, 월 ${KRW(v.monthly)}`).join('\n')}
▪ TOP 5 딜:
${top5}

[작성 조건]
- Notion 마크다운 형식
- 구조: # 주간 영업보고서 → ## 전체 현황 → ## 개인별 현황 → ## 주요 이슈 및 기회 → ## 이번 주 Action Items
- 데이터 기반 인사이트 2-3개
- Action Items는 담당자별로 구체적으로
- 팀 내부 보고용 톤`;
}

function buildDbPrompt(industry, region, sizeRange, service, approach) {

PAYCO 기업복지 아웃바운드 영업을 위한 잠재 고객 DB를 발굴해주세요.

    } catch(e) {
      navigator.clipboard.writeText(result);
      alert('Notion 직접 전송 실패 (CORS 제한).\n\n내용을 클립보드에 복사했습니다.\nNotion 페이지를 열고 붙여넣기 해주세요.\n\n오류: '+e.message);
      setNotionStatus('');
    }
  };

  return (
    <div style={{display:'grid',gridTemplateColumns:'260px 1fr',gap:14,alignItems:'start'}}>
      <div style={{display:'flex',flexDirection:'column',gap:10}}>
        <Card padding={18}>
          <SectionTitle hint="CRM 실시간 데이터 기반">보고서 설정</SectionTitle>
          <Field label="주차 레이블">
            <Input value={dateLabel} onChange={e=>setDateLabel(e.target.value)} placeholder="2026년 5월 1주차"/>
          </Field>
          <div style={{padding:12,background:'var(--bg-sunken)',borderRadius:8,fontSize:11.5,color:'var(--ink-2)',lineHeight:1.7,marginBottom:14}}>
            <div style={{fontWeight:600,marginBottom:4}}>포함 데이터</div>
            <div>• YTD / 이번 달 목표 달성률</div>
            <div>• 인바운드 파이프라인 ({(data.inbound||[]).length}건)</div>
            <div>• 아웃바운드 타겟 ({(data.outbound||[]).length}건)</div>
            <div>• 오픈 딜 ({(data.deals||[]).length}건)</div>
            <div>• 담당자별 실적 분석</div>
          </div>
          <GenBtn onClick={generate} loading={loading} disabled={!settings.claudeKey}>
            {!settings.claudeKey?'API 설정 필요':'✦ 주간보고서 생성'}
          </GenBtn>
          {result && (
            <div style={{marginTop:10,display:'flex',flexDirection:'column',gap:6}}>
              <button onClick={copy} style={{padding:'8px',background:'var(--bg-sunken)',border:'1px solid var(--line)',borderRadius:7,cursor:'pointer',fontFamily:'inherit',fontSize:12}}>
                {copied?'✓ 복사됨':'📋 복사 → Notion 붙여넣기'}
              </button>
              <button onClick={sendNotion} disabled={notionStatus==='loading'} style={{padding:'8px',background:'var(--accent-soft)',border:'1px solid var(--accent)',borderRadius:7,cursor:'pointer',fontFamily:'inherit',fontSize:12,color:notionStatus==='done'?'var(--pos)':'var(--accent)'}}>
                {notionStatus==='loading'?'전송 중…':notionStatus==='done'?'✓ Notion 전송됨':'🔗 Notion 페이지로 전송'}
              </button>
            </div>
          )}
        </Card>
      </div>
      <Card padding={18}><div style={{fontSize:13,fontWeight:600,marginBottom:12}}>생성된 주간보고서 (Notion 마크다운)</div>
        <ResultBox loading={loading} result={result} placeholder={'생성 버튼을 클릭하면\nCRM 데이터 기반 주간보고서를 작성합니다\n\n생성 후 Notion에 직접 전송하거나\n복사→붙여넣기 할 수 있습니다'}/>
      </Card>
    </div>
  );
}

// ── 4. DB Finder ──────────────────────────────────────────────────────────
function DbFinderSection({ settings, callClaude }) {
  const [industry, setIndustry] = useStateAt('');
  const [region, setRegion] = useStateAt('수도권');
  const [size, setSize] = useStateAt('100');
  const [service, setService] = useStateAt('복지포인트');
  const [approach, setApproach] = useStateAt('이메일 퍼스트');
  const [loading, setLoading] = useStateAt(false);
  const [result, setResult] = useStateAt('');
  const [copied, setCopied] = useStateAt(false);

  const presets = ['IT/소프트웨어','제조업','유통/물류','금융/보험','의료/바이오','건설/부동산','항공/여행','식품/외식','교육','공공기관'];
  const generate = async () => {
    setLoading(true); setResult('');
    try { setResult(await callClaude(buildDbPrompt(industry,region,size,service,approach))); }
    catch(e) { alert('오류: '+e.message); }
    finally { setLoading(false); }
  };
  const copy = () => { navigator.clipboard.writeText(result); setCopied(true); setTimeout(()=>setCopied(false),2000); };

  return (
    <div style={{display:'grid',gridTemplateColumns:'300px 1fr',gap:14,alignItems:'start'}}>
      <Card padding={18}>
        <SectionTitle>타겟 조건</SectionTitle>
        <div style={{marginBottom:14}}>
          <div style={{fontSize:11.5,fontWeight:500,color:'var(--ink-2)',marginBottom:7}}>업종 빠른 선택</div>
          <div style={{display:'flex',flexWrap:'wrap',gap:5,marginBottom:8}}>
            {presets.map(p=>(
              <button key={p} onClick={()=>setIndustry(p)} style={{
                padding:'4px 10px',borderRadius:99,border:'1px solid',fontSize:11.5,cursor:'pointer',fontFamily:'inherit',
                borderColor:industry===p?'var(--accent)':'var(--line)',
                background:industry===p?'var(--accent-soft)':'transparent',
                color:industry===p?'var(--accent)':'var(--ink-2)',
              }}>{p}</button>
            ))}
          </div>
          <Input value={industry} onChange={e=>setIndustry(e.target.value)} placeholder="직접 입력 가능" style={{width:'100%'}}/>
        </div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
          <Field label="지역"><Sel value={region} onChange={setRegion} options={['수도권','서울','경기','인천','부산/경남','대구/경북','광주/전남','대전/충청','전국']}/></Field>
          <Field label="최소 임직원"><Sel value={size} onChange={setSize} options={['50','100','200','500','1000']}/></Field>
        </div>
        <Field label="제안 서비스"><Sel value={service} onChange={setService} options={['복지포인트','식권금액형','식권쿠폰형','복지','식권']}/></Field>
        <Field label="접근 전략"><Sel value={approach} onChange={setApproach} options={['이메일 퍼스트','콜드콜 + 이메일','링크드인 + 이메일','소개 영업','이벤트/웨비나 활용']}/></Field>
        <GenBtn onClick={generate} loading={loading} disabled={!settings.claudeKey}>
          {!settings.claudeKey?'API 설정 필요':'✦ DB 발굴 + 전략 생성'}
        </GenBtn>
      </Card>
      <div style={{display:'flex',flexDirection:'column',gap:10}}>
        <Card padding={18}>
          <div style={{fontSize:13,fontWeight:600,marginBottom:12}}>발굴 결과 · 전략</div>
          <ResultBox loading={loading} result={result} placeholder={'타겟 조건을 설정하고 생성 버튼을 클릭하세요\n\n생성 결과:\n• 조건에 맞는 실제 기업 20개 리스트\n• 업종별 복지 니즈 분석\n• 서비스 어필 포인트 3가지\n• 콜드컨택 접근 전략 상세'}/>
        </Card>
        <ActionBar result={result} onCopy={copy} copied={copied}/>
      </div>
    </div>
  );
}

// ── Main AutomationView ───────────────────────────────────────────────────
function AutomationView({ data }) {
  const [settings, setSettings] = useStateAt(() => {
    try { return JSON.parse(localStorage.getItem('bizplus_crm_v1') || '{}'); }
    catch { return {}; }
  });
  const [section, setSection] = useStateAt('inbound');

  const saveSettings = s => {
    setSettings(s);
    localStorage.setItem('bizplus_crm_v1', JSON.stringify(s));
  };

  const callClaude = async (prompt) => {
    if (!settings.claudeKey) throw new Error('API 설정 탭에서 Claude API 키를 먼저 입력해주세요');
    return callClaudeApi(settings.claudeKey, settings.claudeModel, prompt);
  };

  const tabs = [
    { key:'inbound', label:'인바운드 리마인드', icon:'◇' },
    { key:'outbound', label:'콜드메일 초안', icon:'◈' },
    { key:'report', label:'주간 영업보고서', icon:'◑' },
    { key:'db', label:'DB 발굴 도우미', icon:'◎' },
    { key:'settings', label:'API 설정', icon:'⚙' },
  ];

  return (
    <div style={{display:'flex',flexDirection:'column',gap:16}}>
      <Card padding={8} style={{display:'flex',gap:4,flexWrap:'wrap',alignItems:'center'}}>
        {tabs.map(t=>(
          <button key={t.key} onClick={()=>setSection(t.key)} style={{
            padding:'8px 14px',border:'none',borderRadius:8,cursor:'pointer',fontFamily:'inherit',
            background:section===t.key?'var(--ink)':'transparent',
            color:section===t.key?'#fff':'var(--ink-2)',
            fontSize:12.5,fontWeight:500,display:'flex',alignItems:'center',gap:6,
          }}>
            <span style={{fontSize:11,opacity:0.7}}>{t.icon}</span>{t.label}
          </button>
        ))}
        {!settings.claudeKey && (
          <div style={{marginLeft:'auto',display:'flex',alignItems:'center',gap:6,fontSize:12,color:'var(--warn)'}}>
            ⚠ Claude API 미설정
            <button onClick={()=>setSection('settings')} style={{color:'var(--accent)',background:'none',border:'none',cursor:'pointer',fontSize:12,textDecoration:'underline'}}>설정하기 →</button>
          </div>
        )}
      </Card>
      {section==='settings' && <ApiSettingsPanel settings={settings} onSave={saveSettings}/>}
      {section==='inbound' && <InboundMailSection data={data} settings={settings} callClaude={callClaude}/>}
      {section==='outbound' && <OutboundMailSection data={data} settings={settings} callClaude={callClaude}/>}
      {section==='report' && <WeeklyReportSection data={data} settings={settings} callClaude={callClaude}/>}
      {section==='db' && <DbFinderSection settings={settings} callClaude={callClaude}/>}
    </div>
  );
}

Object.assign(window, { AutomationView });

</script>

<!-- app.jsx -->
<script type="text/babel">
/* eslint-disable */
const { useState: useStateA, useEffect: useEffectA } = React;

function App() {
  const [data, setData] = useStateA(null);
  const [tab, setTab] = useStateA("dashboard");
  const [modal, setModal] = useStateA(null); // 'inbound' | 'outbound' | 'deal' | 'quick' | null
  const [toast, setToast] = useStateA(null);
  const [importModal, setImportModal] = useStateA(false);

  useEffectA(() => {
    try {
      const stored = localStorage.getItem('bizplus_crm_data_v1');
      if (stored) {
        const parsed = JSON.parse(stored);
        setData({ ...window.__CRM_DATA__, ...parsed });
        return;
      }
    } catch(e) {}
    setData(window.__CRM_DATA__);
  }, []);

  useEffectA(() => {
    if (data) {
      try {
        localStorage.setItem('bizplus_crm_data_v1', JSON.stringify({
          inbound: data.inbound,
          outbound: data.outbound,
          deals: data.deals,
        }));
      } catch(e) {}
    }
  }, [data]);

  if (!data) {
    return (
      <div style={{ minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", color: "var(--ink-3)" }}>
        데이터 로딩 중…
      </div>
    );
  }

  const summary = summarizeGoals(data.goals);

  const addInbound = (item) => {
    setData({ ...data, inbound: [item, ...data.inbound] });
    setToast(`${item.name} 인바운드 등록 완료`);
  };
  const addOutbound = (item) => {
    setData({ ...data, outbound: [item, ...data.outbound] });
    setToast(`${item.name} 아웃바운드 타겟 추가`);
  };
  const addDeal = (item) => {
    setData({ ...data, deals: [item, ...data.deals] });
    setToast(`${item.name} 오픈 딜 등록 완료`);
  };

  const handleImport = (newData) => {
    setData(newData);
    setToast(`가져오기 완료 — 인바운드 ${newData.inbound.length}건 · 아웃바운드 ${newData.outbound.length}건 · 딜 ${newData.deals.length}건`);
  };

  const openNewActivity = () => setModal("quick");
  const openNewInbound = () => setModal("inbound");
  const openNewOutbound = () => setModal("outbound");
  const openNewDeal = () => setModal("deal");

  return (
    <div style={{ display: "grid", gridTemplateColumns: "224px 1fr", minHeight: "100vh" }}>
      {/* Sidebar */}
      <aside style={{
        background: "#15140f", color: "#e8e6df",
        padding: "20px 14px", display: "flex", flexDirection: "column", gap: 18,
        borderRight: "1px solid #15140f", position: "sticky", top: 0, height: "100vh", overflowY: "auto",
      }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10, padding: "4px 8px" }}>
          <div style={{
            width: 28, height: 28, borderRadius: 7,
            background: "linear-gradient(135deg, #4d5fc7, #2b3aa3)",
            display: "flex", alignItems: "center", justifyContent: "center",
            fontWeight: 700, fontSize: 13, color: "#fff",
          }}>B+</div>
          <div>
            <div style={{ fontSize: 12.5, fontWeight: 600, letterSpacing: "-0.01em" }}>비즈플러스제휴팀</div>
            <div style={{ fontSize: 10.5, color: "rgba(232,230,223,0.55)" }}>PAYCO 기업복지 CRM</div>
          </div>
        </div>

        <nav style={{ display: "flex", flexDirection: "column", gap: 2 }}>
          <NavItem icon="◐" label="대시보드" active={tab === "dashboard"} onClick={() => setTab("dashboard")} />
          <NavItem icon="◇" label="인바운드" badge={data.inbound.filter(i => i.status === "검토중").length} active={tab === "inbound"} onClick={() => setTab("inbound")} />
          <NavItem icon="◈" label="아웃바운드" badge={data.outbound.length} active={tab === "outbound"} onClick={() => setTab("outbound")} />
          <NavItem icon="◆" label="오픈 딜" badge={data.deals.length} active={tab === "deals"} onClick={() => setTab("deals")} />
          <div style={{ borderTop: "1px solid rgba(255,255,255,0.08)", margin: "10px 0" }} />
          <NavItem icon="◑" label="매출 분석" active={tab === "revenue"} onClick={() => setTab("revenue")} />
          <NavItem icon="✦" label="AI 자동화" active={tab === "automation"} onClick={() => setTab("automation")} />
          <NavItem icon="○" label="리포트" onClick={() => setToast("리포트는 곧 출시됩니다")} />
          <NavItem icon="○" label="설정" onClick={() => setToast("설정은 곧 출시됩니다")} />
        </nav>

        <button onClick={() => setImportModal(true)} style={{
          display:"flex", alignItems:"center", gap:8, width:"100%",
          padding:"9px 12px", border:"1px solid rgba(255,255,255,0.12)", borderRadius:8,
          background:"rgba(255,255,255,0.06)", color:"rgba(232,230,223,0.85)",
          cursor:"pointer", fontSize:12.5, fontFamily:"inherit", fontWeight:500, marginBottom:6,
        }}>
          <span>⬆</span> 데이터 가져오기
        </button>

        <div style={{ marginTop: "auto", padding: "12px 10px", background: "rgba(255,255,255,0.04)", borderRadius: 8 }}>
          <div style={{ fontSize: 10, color: "rgba(232,230,223,0.55)", letterSpacing: "0.06em", textTransform: "uppercase", fontWeight: 500, marginBottom: 6 }}>2026 YTD</div>
          <div className="mono" style={{ fontSize: 18, fontWeight: 700, letterSpacing: "-0.02em" }}>{KRW(summary.ytdActual)}</div>
          <div style={{ height: 4, background: "rgba(255,255,255,0.08)", borderRadius: 99, marginTop: 8, marginBottom: 6 }}>
            <div style={{ height: "100%", width: `${Math.min(summary.annualRate, 1) * 100}%`, background: "linear-gradient(90deg, #6c7ee0, #2b3aa3)", borderRadius: 99 }} />
          </div>
          <div style={{ fontSize: 10.5, color: "rgba(232,230,223,0.55)" }}>
            연목표 {KRW(summary.annualGoal)} · {(summary.annualRate * 100).toFixed(1)}%
          </div>
        </div>

        <div style={{ display: "flex", alignItems: "center", gap: 8, padding: "0 6px" }}>
          <Avatar name="비즈플러스" size={24} />
          <div style={{ fontSize: 11.5, lineHeight: 1.3 }}>
            <div style={{ fontWeight: 500 }}>강동헌, 이종민</div>
            <div style={{ color: "rgba(232,230,223,0.55)", fontSize: 10 }}>2명 활성</div>
          </div>
        </div>
      </aside>

      {/* Main */}
      <main style={{ padding: "22px 28px 60px", maxWidth: 1500, width: "100%" }}>
        <Header tab={tab} data={data} onNewActivity={openNewActivity} onSync={() => setToast("엑셀 시트 동기화 완료")} />
        {tab === "dashboard" && <Dashboard data={data} setTab={setTab} />}
        {tab === "inbound" && <InboundView data={data} setData={setData} onNew={openNewInbound} />}
        {tab === "outbound" && <OutboundView data={data} setData={setData} onNew={openNewOutbound} />}
        {tab === "deals" && <DealsView data={data} onNew={openNewDeal} />}
        {tab === "revenue" && <RevenueView data={data} />}
        {tab === "automation" && <AutomationView data={data} />}
      </main>

      {modal === "quick" && <QuickActionModal onClose={() => setModal(null)} onPick={(k) => setModal(k)} />}
      {modal === "inbound" && <NewInboundModal onClose={() => setModal(null)} onSave={addInbound} />}
      {modal === "outbound" && <NewOutboundModal onClose={() => setModal(null)} onSave={addOutbound} />}
      {modal === "deal" && <NewDealModal onClose={() => setModal(null)} onSave={addDeal} />}
      {toast && <Toast msg={toast} onDone={() => setToast(null)} />}
      {importModal && <DataImportModal onClose={() => setImportModal(false)} onImport={handleImport} currentData={data} />}
    </div>
  );
}

function NavItem({ icon, label, badge, active, onClick, disabled }) {
  return (
    <button onClick={onClick} disabled={disabled} style={{
      display: "flex", alignItems: "center", gap: 10,
      padding: "8px 12px", border: "none",
      background: active ? "rgba(255,255,255,0.08)" : "transparent",
      color: disabled ? "rgba(232,230,223,0.3)" : (active ? "#fff" : "rgba(232,230,223,0.78)"),
      borderRadius: 7, fontSize: 13, fontWeight: active ? 600 : 500,
      cursor: disabled ? "not-allowed" : "pointer", letterSpacing: "-0.01em",
      textAlign: "left", justifyContent: "space-between",
    }}>
      <span style={{ display: "inline-flex", alignItems: "center", gap: 10 }}>
        <span style={{ width: 16, fontSize: 11, opacity: 0.7 }}>{icon}</span>
        {label}
      </span>
      {badge != null && <span className="mono" style={{
        fontSize: 10, padding: "1px 6px", borderRadius: 99,
        background: active ? "var(--accent)" : "rgba(255,255,255,0.08)",
        color: active ? "#fff" : "rgba(232,230,223,0.7)", fontWeight: 600,
      }}>{badge}</span>}
    </button>
  );
}

function Header({ tab, data, onNewActivity, onSync }) {
  const titles = {
    dashboard: { title: "대시보드", sub: "팀 전체 매출·영업 현황 실시간 모니터링" },
    inbound: { title: "인바운드 관리", sub: `2026년 인입 ${data.inbound.length}건 · 오픈비율 ${((data.inbound.filter(i=>i.status==="오픈").length / data.inbound.length) * 100).toFixed(1)}%` },
    outbound: { title: "아웃바운드 관리", sub: `타겟 ${data.outbound.length}개 추적 중` },
    deals: { title: "오픈 딜", sub: `2026년 오픈 ${data.deals.length}개 기업` },
    revenue: { title: "매출 분석", sub: "거래액·매출·매출이익 시뮬레이션" },
    automation: { title: "AI 자동화", sub: "이메일 초안 · 주간보고서 · DB 발굴 — Claude 연동" },
  };
  const t = titles[tab];
  return (
    <div style={{ display: "flex", alignItems: "flex-end", justifyContent: "space-between", marginBottom: 22 }}>
      <div>
        <div style={{ fontSize: 11.5, color: "var(--ink-3)", marginBottom: 4, fontWeight: 500, letterSpacing: "0.02em" }}>
          비즈플러스제휴팀 · 주간관리 · 2026.05.06 (수)
        </div>
        <h1 style={{ margin: 0, fontSize: 26, fontWeight: 700, letterSpacing: "-0.025em" }}>{t.title}</h1>
        <div style={{ fontSize: 13, color: "var(--ink-2)", marginTop: 4 }}>{t.sub}</div>
      </div>
      <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
        <LiveDot />
        <span style={{ fontSize: 11.5, color: "var(--ink-3)" }}>마지막 동기화 방금 전</span>
        <button onClick={onSync} style={{
          background: "var(--bg-elev)", color: "var(--ink-2)",
          border: "1px solid var(--line)", padding: "8px 12px",
          borderRadius: 8, fontSize: 12.5, fontWeight: 500, cursor: "pointer", marginLeft: 6,
        }}>↗ 엑셀 동기화</button>
        <button onClick={onNewActivity} style={{
          background: "var(--ink)", color: "#fff",
          border: "none", padding: "8px 14px",
          borderRadius: 8, fontSize: 12.5, fontWeight: 500, cursor: "pointer",
        }}>+ 새 활동</button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>

</body>
