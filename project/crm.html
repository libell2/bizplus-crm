<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>비즈플러스제휴팀 · CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet" />
<style>
  :root {
    --bg: #f7f6f2;
    --bg-elev: #ffffff;
    --bg-sunken: #f0eee8;
    --ink: #15140f;
    --ink-2: #4a4842;
    --ink-3: #8a8780;
    --ink-4: #b9b6ad;
    --line: #e5e2d8;
    --line-2: #ecead .2;
    --line-soft: #efede4;
    --accent: #2b3aa3;        /* indigo */
    --accent-soft: #e8eafc;
    --pos: #1d6b48;
    --pos-soft: #e3f1e8;
    --neg: #a83b2c;
    --neg-soft: #f6e4e0;
    --warn: #8a6a14;
    --warn-soft: #f5edd6;
    --neutral-soft: #ecead9;
    --shadow-1: 0 1px 0 rgba(20,18,12,0.04), 0 1px 2px rgba(20,18,12,0.04);
    --shadow-2: 0 8px 24px -8px rgba(20,18,12,0.12), 0 2px 6px rgba(20,18,12,0.04);
    --radius: 10px;
    --radius-sm: 6px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: "Pretendard", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    font-feature-settings: "ss01", "tnum";
  }
  .mono { font-family: "JetBrains Mono", ui-monospace, monospace; font-feature-settings: "tnum"; }
  button { font-family: inherit; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: #d6d3c8; border-radius: 8px; }
  ::-webkit-scrollbar-thumb:hover { background: #b9b6ad; }
  ::-webkit-scrollbar-track { background: transparent; }

  #root { min-height: 100vh; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="src/utils.jsx"></script>
<script type="text/babel" src="src/components.jsx"></script>
<script type="text/babel" src="src/modals.jsx"></script>
<script type="text/babel" src="src/dashboard.jsx"></script>
<script type="text/babel" src="src/inbound.jsx"></script>
<script type="text/babel" src="src/outbound.jsx"></script>
<script type="text/babel" src="src/deals.jsx"></script>
<script type="text/babel" src="src/revenue.jsx"></script>
<script type="text/babel" src="src/app.jsx"></script>
</body>
</html>
